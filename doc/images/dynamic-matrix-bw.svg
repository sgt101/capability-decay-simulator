<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" width="4400" height="2960">
  <style>
    .title   { font-family: Arial, sans-serif; font-weight: bold; }
    .sub      { font-family: Arial, sans-serif; }
    .hdr      { font-family: Arial, sans-serif; font-weight: bold; font-size: 15px; }
    .cap      { font-family: Arial, sans-serif; font-weight: bold; font-size: 14px; }
    .verb     { font-family: Arial, sans-serif; font-weight: bold; font-size: 14px; }
  </style>

  <defs>
    <!-- soft depth for the blocks -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.30"/>
    </filter>

    <!-- greyscale stage gradients (light -> dark progression toward harms) -->
    <linearGradient id="flowA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ECECEC"/><stop offset="1" stop-color="#A8A5A2"/>
    </linearGradient>
    <linearGradient id="flowB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A8A5A2"/><stop offset="1" stop-color="#ECECEC"/>
    </linearGradient>
    <linearGradient id="flowC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ECECEC"/><stop offset="1" stop-color="#434241"/>
    </linearGradient>

    <!-- diagonal hatch to differentiate the Transmitters stage without colour -->
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#FFFFFF"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#747271" stroke-width="2.5"/>
    </pattern>
  </defs>

  <rect width="1100" height="740" fill="#FFFFFF"/>

 

  <!-- ===== Flowing connector bands (drawn first, behind boxes) ===== -->
  <!-- Band A: Drivers -> Transmitters -->
  <path d="M260,241 C295,241 295,235 330,235 L330,565 C295,565 295,559 260,559 Z"
        fill="url(#flowA)" fill-opacity="0.6"/>
  <polygon points="288,318 300,326 288,334" fill="#434241"/>
  <polygon points="288,474 300,482 288,490" fill="#434241"/>

  <!-- Band B: Transmitters -> Functions -->
  <path d="M500,235 C540,235 540,155 580,155 L580,645 C540,645 540,565 500,565 Z"
        fill="url(#flowB)" fill-opacity="0.6"/>
  <polygon points="528,318 540,326 528,334" fill="#434241"/>
  <polygon points="528,474 540,482 528,490" fill="#434241"/>

  <!-- Band C: Functions -> Harms -->
  <path d="M740,155 C785,155 785,145 830,145 L830,655 C785,655 785,645 740,645 Z"
        fill="url(#flowC)" fill-opacity="0.6"/>
  <polygon points="773,318 785,326 773,334" fill="#000000"/>
  <polygon points="773,474 785,482 773,490" fill="#000000"/>

  <!-- ===== Column headers (tonal pills) ===== -->
  <g text-anchor="middle">
    <rect x="90"  y="82" width="150" height="30" rx="15" fill="#000000"/>
    <text x="165" y="102" class="hdr" fill="#FFFFFF">DRIVERS</text>

    <rect x="340" y="82" width="150" height="30" rx="15" fill="#000000"/>
    <text x="415" y="102" class="hdr" fill="#FFFFFF">TRANSMITTERS</text>

    <rect x="585" y="82" width="150" height="30" rx="15" fill="#000000"/>
    <text x="660" y="102" class="hdr" fill="#FFFFFF">FUNCTIONS</text>

    <rect x="850" y="82" width="150" height="30" rx="15" fill="#000000"/>
    <text x="925" y="102" class="hdr" fill="#FFFFFF">HARMS</text>
  </g>

  <!-- ===== Column 1: Drivers (light grey) ===== -->
  <g text-anchor="middle" filter="url(#shadow)">
    <rect x="70" y="241" width="190" height="90" rx="12" fill="#ECECEC" stroke="#434241" stroke-width="1.5"/>
    <rect x="70" y="355" width="190" height="90" rx="12" fill="#ECECEC" stroke="#434241" stroke-width="1.5"/>
    <rect x="70" y="469" width="190" height="90" rx="12" fill="#ECECEC" stroke="#434241" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" fill="#434241">
    <text x="165" y="281" class="cap">DIFFERENT TYPE OF</text>
    <text x="165" y="299" class="cap">INTERACTION AND</text>
    <text x="165" y="317" class="cap">INTERFACE</text>

    <text x="165" y="395" class="cap">AI AS A GENERAL</text>
    <text x="165" y="413" class="cap">PURPOSE TOOL</text>

    <text x="165" y="509" class="cap">MODERN AI IS</text>
    <text x="165" y="527" class="cap">CAPITAL INTENSIVE</text>
  </g>

  <!-- ===== Column 2: Transmitters (hatched) ===== -->
  <g text-anchor="middle" filter="url(#shadow)">
    <rect x="330" y="235" width="170" height="150" rx="12" fill="url(#hatch)" stroke="#434241" stroke-width="1.5"/>
    <rect x="330" y="415" width="170" height="150" rx="12" fill="url(#hatch)" stroke="#434241" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" fill="#000000">
    <rect x="345" y="291" width="140" height="40" fill="#FFFFFF" opacity="0.85"/>
    <text x="415" y="303" class="cap">INDIVIDUAL</text>
    <text x="415" y="321" class="cap">PSYCHOLOGY</text>

    <rect x="345" y="471" width="140" height="40" fill="#FFFFFF" opacity="0.85"/>
    <text x="415" y="483" class="cap">INSTITUTIONAL</text>
    <text x="415" y="501" class="cap">CULTURE</text>
  </g>

  <!-- ===== Column 3: Functions (white, outlined) ===== -->
  <g text-anchor="middle" filter="url(#shadow)">
    <rect x="580" y="155" width="160" height="70" rx="10" fill="#FFFFFF" stroke="#434241" stroke-width="1.5"/>
    <rect x="580" y="239" width="160" height="70" rx="10" fill="#FFFFFF" stroke="#434241" stroke-width="1.5"/>
    <rect x="580" y="323" width="160" height="70" rx="10" fill="#FFFFFF" stroke="#434241" stroke-width="1.5"/>
    <rect x="580" y="407" width="160" height="70" rx="10" fill="#FFFFFF" stroke="#434241" stroke-width="1.5"/>
    <rect x="580" y="491" width="160" height="70" rx="10" fill="#FFFFFF" stroke="#434241" stroke-width="1.5"/>
    <rect x="580" y="575" width="160" height="70" rx="10" fill="#FFFFFF" stroke="#434241" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" fill="#434241">
    <text x="660" y="195" class="cap">PAYMENTS</text>
    <text x="660" y="279" class="cap">CAPITAL POOLING</text>
    <text x="660" y="363" class="cap">RESOURCE TRANSFER</text>
    <text x="660" y="447" class="cap">RISK MANAGEMENT</text>
    <text x="660" y="531" class="cap">INFORMATION</text>
    <text x="660" y="615" class="cap">INCENTIVE MGMT</text>
  </g>

  <!-- ===== Column 4: Harms (dark) ===== -->
  <g text-anchor="middle" filter="url(#shadow)">
    <rect x="830" y="145" width="190" height="150" rx="12" fill="#434241"/>
    <rect x="830" y="325" width="190" height="150" rx="12" fill="#434241"/>
    <rect x="830" y="505" width="190" height="150" rx="12" fill="#434241"/>
  </g>
  <g text-anchor="middle" fill="#FFFFFF">
    <text x="925" y="213" class="cap">DIRECT CONSUMER</text>
    <text x="925" y="231" class="cap">HARMS</text>

    <text x="925" y="393" class="cap">MARKET FUNCTION</text>
    <text x="925" y="411" class="cap">HARMS AND GAPS</text>

    <text x="925" y="573" class="cap">SOUNDNESS AND</text>
    <text x="925" y="591" class="cap">STABILITY RISKS</text>
  </g>

  <!-- ===== Stage verb pills (float over the flow bands) ===== -->
  <g text-anchor="middle">
    <rect x="248" y="386" width="96" height="28" rx="14" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="296" y="405" class="verb" fill="#000000">GENERATES</text>

    <rect x="494" y="386" width="92" height="28" rx="14" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="540" y="405" class="verb" fill="#000000">IMPACTS</text>

    <rect x="739" y="386" width="92" height="28" rx="14" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="785" y="405" class="verb" fill="#000000">CREATES</text>
  </g>
</svg>
