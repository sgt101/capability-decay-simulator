<title>Experiment Report — Capability Decay Simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #eef0ee;
    --panel: #ffffff;
    --panel-2: #f4f5f3;
    --ink: #14181a;
    --ink-muted: #5c6360;
    --ink-faint: #8b918d;
    --rule: #d7dad6;
    --accent: #a8502c;
    --accent-soft: #f3e2da;
    --accent2: #35636b;
    --accent2-soft: #dfe9ea;
    --shadow: 0 1px 2px rgba(20, 24, 26, 0.07);
    --diverge-zero: #e4e2dc;
    --diverge-pos-mid: #2f7d6c;
    --diverge-pos-end: #0f4a3d;
    --diverge-neg-mid: #a8502c;
    --diverge-neg-end: #5c2712;
    --ref-line: #6b3fa0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101314;
      --panel: #171b1d;
      --panel-2: #1d2224;
      --ink: #e8eae6;
      --ink-muted: #93a09c;
      --ink-faint: #656e6b;
      --rule: #2b3234;
      --accent: #dd8259;
      --accent-soft: #35271f;
      --accent2: #7fb0b7;
      --accent2-soft: #1c2b2d;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
      --diverge-zero: #2c3335;
      --diverge-pos-mid: #5fc9ac;
      --diverge-pos-end: #a8f0d6;
      --diverge-neg-mid: #dd8259;
      --diverge-neg-end: #ffb38c;
      --ref-line: #c79bff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101314;
    --panel: #171b1d;
    --panel-2: #1d2224;
    --ink: #e8eae6;
    --ink-muted: #93a09c;
    --ink-faint: #656e6b;
    --rule: #2b3234;
    --accent: #dd8259;
    --accent-soft: #35271f;
    --accent2: #7fb0b7;
    --accent2-soft: #1c2b2d;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    --diverge-zero: #2c3335;
    --diverge-pos-mid: #5fc9ac;
    --diverge-pos-end: #a8f0d6;
    --diverge-neg-mid: #dd8259;
    --diverge-neg-end: #ffb38c;
    --ref-line: #c79bff;
  }
  :root[data-theme="light"] {
    --bg: #eef0ee;
    --panel: #ffffff;
    --panel-2: #f4f5f3;
    --ink: #14181a;
    --ink-muted: #5c6360;
    --ink-faint: #8b918d;
    --rule: #d7dad6;
    --accent: #a8502c;
    --accent-soft: #f3e2da;
    --accent2: #35636b;
    --accent2-soft: #dfe9ea;
    --shadow: 0 1px 2px rgba(20, 24, 26, 0.07);
    --diverge-zero: #e4e2dc;
    --diverge-pos-mid: #2f7d6c;
    --diverge-pos-end: #0f4a3d;
    --diverge-neg-mid: #a8502c;
    --diverge-neg-end: #5c2712;
    --ref-line: #6b3fa0;
  }

  * {
    box-sizing: border-box;
  }
  html,
  body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family:
      ui-sans-serif,
      -apple-system,
      "Segoe UI",
      Roboto,
      sans-serif;
    font-size: 14.5px;
    -webkit-font-smoothing: antialiased;
  }
  h1,
  h2,
  h3 {
    margin: 0;
    font-family: ui-serif, Charter, "Iowan Old Style", Georgia, serif;
    font-weight: 600;
  }
  code,
  .mono {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .tabular {
    font-variant-numeric: tabular-nums;
  }

  .app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  /* Set-level note. Deliberately above the heatmap rather than in the sidebar: it says
     what the numbers on this page ARE, and a reader who misses it misreads every panel. */
  .set-note { padding: 0.75rem 1rem; border-left: 3px solid var(--accent); }
  .set-note a { color: var(--accent); }
  .set-note h2 { font-size: 0.85rem; margin: 0 0 0.4rem; }
  .set-note p { margin: 0 0 0.45rem; font-size: 0.82rem; line-height: 1.55; color: var(--ink-muted); max-width: 62rem; }
  .set-note p:last-child { margin-bottom: 0; }
  .set-note b { color: var(--ink); }
  .set-note details { margin-top: 0.5rem; }
  .set-note summary { cursor: pointer; font-size: 0.8rem; color: var(--accent); }
  /* Image-export toolbar. Sits with the figure it exports rather than in the topbar,
     because there are three exportable figures on this page (the heatmap and the two
     trajectory panels) and a single global button could not say which one it meant. */
  .fig-toolbar { display: flex; gap: 0.4rem; align-items: center; margin: 0 0 0.4rem; }
  .fig-toolbar.right { justify-content: flex-end; margin: 0.35rem 0 0; }
  .topbar {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    flex-wrap: wrap;
    padding: 0.7rem 1.1rem;
    background: var(--panel);
    border-bottom: 1px solid var(--rule);
  }
  .topbar h1 {
    font-size: 1.1rem;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .topbar .meta {
    font-size: 0.74rem;
    color: var(--ink-faint);
    font-family: ui-monospace, monospace;
  }
  .spacer {
    flex: 1;
  }
  select {
    font: inherit;
    background: var(--panel-2);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 0.35rem 0.5rem;
  }
  .field-inline {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    color: var(--ink-muted);
  }
  .field-inline input[type="range"] {
    width: 160px;
    accent-color: var(--accent2);
  }
  .btn {
    font-size: 0.78rem;
    padding: 0.35rem 0.65rem;
    border-radius: 4px;
    border: 1px solid var(--rule);
    background: var(--panel-2);
    color: var(--ink);
    cursor: pointer;
  }
  .btn.active {
    background: var(--accent2);
    color: #fff;
    border-color: transparent;
  }

  .layout {
    display: grid;
    grid-template-columns: 270px 1fr;
    flex: 1;
    min-height: 0;
  }
  @media (max-width: 860px) {
    .layout {
      grid-template-columns: 1fr;
    }
  }

  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--rule);
    overflow-y: auto;
    max-height: calc(100vh - 57px);
  }
  .exp-list {
    list-style: none;
    margin: 0;
    padding: 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }
  .exp-item {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
    text-align: left;
    padding: 0.5rem 0.6rem;
    border-radius: 5px;
    border: 1px solid transparent;
    background: none;
    cursor: pointer;
    font: inherit;
    color: var(--ink);
  }
  .exp-item:hover {
    background: var(--panel-2);
  }
  .exp-item.selected {
    background: var(--accent2-soft);
    border-color: var(--accent2);
  }
  .exp-item .n {
    font-family: ui-monospace, monospace;
    font-size: 0.7rem;
    color: var(--ink-faint);
  }
  .exp-item .scenario { display: block; font-size: 0.78rem; color: var(--ink); font-weight: 600; margin: 0.1rem 0 0.05rem; }
  .exp-item .pair {
    font-size: 0.86rem;
    font-weight: 600;
  }
  .exp-item .pair .sym {
    color: var(--accent2);
    font-family: ui-monospace, monospace;
    font-weight: 500;
  }
  .exp-item .missing {
    font-size: 0.72rem;
    color: var(--ink-faint);
    font-style: italic;
  }

  .sidebar-section {
    padding: 0.7rem 0.9rem;
    border-top: 1px solid var(--rule);
  }
  .sidebar-section h3 {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    margin-bottom: 0.5rem;
  }
  .fixed-kv {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    padding: 0.18rem 0;
  }
  .fixed-kv .sym {
    color: var(--accent2);
    font-family: ui-monospace, monospace;
    margin-right: 0.4rem;
  }
  .fixed-kv b {
    font-family: ui-monospace, monospace;
    font-weight: 600;
  }

  .main {
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    min-width: 0;
    overflow: auto;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 6px;
    box-shadow: var(--shadow);
    padding: 1rem;
  }
  .heatmap-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.7rem;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .heatmap-head h2 {
    font-size: 1.05rem;
  }
  .heatmap-head .sub {
    font-size: 0.78rem;
    color: var(--ink-muted);
  }

  /* Panel statistics strip — grid mean/range, the noise floor, and the signal-to-noise
     that says whether the surface below is worth reading at all. Sits between the title
     and the canvas deliberately: after the reader knows what they are looking at, and
     before they start reading colours off it. */
  .stats-strip {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.15rem 1.1rem;
    margin: 0 0 0.7rem;
    padding: 0.45rem 0.6rem;
    background: var(--panel-2);
    border: 1px solid var(--rule);
    border-radius: 4px;
    font-size: 0.72rem;
    font-family: ui-monospace, monospace;
    color: var(--ink-muted);
  }
  .stats-strip b {
    color: var(--ink);
    font-weight: 600;
  }
  .stats-strip .sn-badge {
    margin-left: auto;
    padding: 0.1rem 0.45rem;
    border-radius: 3px;
    font-weight: 600;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  /* Three bands, not a gradient: the reader needs a verdict, not a percentile. Under 2
     the sweep's spread does not clear its own seed noise; over 6 it is unambiguous. */
  .stats-strip .sn-flat   { background: rgba(190, 60, 60, 0.16);  color: #c0392b; }
  .stats-strip .sn-weak   { background: rgba(200, 150, 40, 0.18); color: #9a7415; }
  .stats-strip .sn-strong { background: rgba(60, 150, 90, 0.16);  color: #2e7d4f; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .stats-strip .sn-flat   { color: #f08a80; }
    :root:not([data-theme="light"]) .stats-strip .sn-weak   { color: #e0be6a; }
    :root:not([data-theme="light"]) .stats-strip .sn-strong { color: #7fd4a2; }
  }
  :root[data-theme="dark"] .stats-strip .sn-flat   { color: #f08a80; }
  :root[data-theme="dark"] .stats-strip .sn-weak   { color: #e0be6a; }
  :root[data-theme="dark"] .stats-strip .sn-strong { color: #7fd4a2; }

  /* Sits above the table only — the heatmap has nothing to copy as a tabular. */
  .table-toolbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 0.5rem;
  }
  .copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.28rem 0.6rem;
    font: inherit;
    font-size: 0.72rem;
    color: var(--ink-muted);
    background: var(--panel-2);
    border: 1px solid var(--rule);
    border-radius: 4px;
    cursor: pointer;
  }
  .copy-btn:hover { color: var(--ink); border-color: var(--ink-faint); }
  .copy-btn:active { transform: translateY(1px); }
  .copy-btn.is-done { color: #2e7d4f; border-color: #2e7d4f; }
  .copy-btn.is-fail { color: #c0392b; border-color: #c0392b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .copy-btn.is-done { color: #7fd4a2; border-color: #7fd4a2; }
    :root:not([data-theme="light"]) .copy-btn.is-fail { color: #f08a80; border-color: #f08a80; }
  }
  :root[data-theme="dark"] .copy-btn.is-done { color: #7fd4a2; border-color: #7fd4a2; }
  :root[data-theme="dark"] .copy-btn.is-fail { color: #f08a80; border-color: #f08a80; }

  .heatmap-wrap {
    position: relative;
  }
  #heatmapCanvas {
    width: 100%;
    height: 480px;
    display: block;
    cursor: crosshair;
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-top: 0.8rem;
    font-size: 0.74rem;
    color: var(--ink-muted);
    font-family: ui-monospace, monospace;
  }
  .legend-ramp {
    flex: 1;
    height: 12px;
    border-radius: 3px;
    position: relative;
  }

  .figure-caption {
    margin-top: 0.8rem;
    padding-top: 0.6rem;
    border-top: 1px solid var(--rule);
    font-size: 0.72rem;
    line-height: 1.55;
  }
  .figure-caption .axis-line {
    color: var(--ink-muted);
    margin-bottom: 0.25rem;
  }
  .figure-caption .axis-line .sym {
    color: var(--accent2);
    font-family: ui-monospace, monospace;
    margin-right: 0.3rem;
  }
  .figure-caption .axis-line b {
    font-weight: 600;
  }
  .figure-caption .fixed-line {
    color: var(--ink-faint);
    margin-top: 0.35rem;
  }
  .figure-caption .fixed-line .kv {
    font-family: ui-monospace, monospace;
  }
  .legend-ramp .zero-tick {
    position: absolute;
    top: -3px;
    bottom: -3px;
    width: 2px;
    background: var(--ink);
    opacity: 0.6;
  }

  /* The metric names are compressed to fit a toolbar — "Capability shortfall
     (expert-equivalents)" is a label, not an explanation. The ? carries the sentence
     that says what the reader is looking at.
     Opens on hover AND on focus AND on click: hover alone would be unreachable from a
     keyboard and invisible on a touchscreen. */
  .field-inline { position: relative; }
  .help-dot {
    display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; margin-left: 0.3rem; padding: 0;
    border: 1px solid var(--rule); border-radius: 50%; background: none;
    color: var(--ink-faint); font: inherit; font-size: 0.66rem; line-height: 1; cursor: help;
  }
  .help-dot:hover, .help-dot[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
  .help-dot:focus-visible { outline: 2px solid var(--accent2); outline-offset: 1px; }
  .help-box {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 20;
    width: max-content; max-width: 320px;
    background: var(--panel); color: var(--ink-muted);
    border: 1px solid var(--rule); border-radius: 5px;
    padding: 0.5rem 0.65rem; font-size: 0.76rem; line-height: 1.5;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  }
  .help-box b { color: var(--ink); font-weight: 600; display: block; margin-bottom: 0.2rem; }

  .chart-tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--ink);
    color: var(--bg);
    font-family: ui-monospace, monospace;
    font-size: 0.72rem;
    line-height: 1.5;
    border-radius: 4px;
    padding: 0.45rem 0.65rem;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    white-space: nowrap;
    z-index: 5;
  }
  .chart-tooltip .row {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
  }
  /* The code row is the one line meant to be COPIED elsewhere (into a paper, into the
     simulator's code box), so it is set apart from the metric readouts around it. */
  .chart-tooltip .code-row {
    font-weight: 700;
    padding-bottom: 0.3rem;
    margin-bottom: 0.3rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.25);
  }

  table.data-table {
    border-collapse: collapse;
    width: 100%;
    font-size: 0.82rem;
  }
  table.data-table th,
  table.data-table td {
    border: 1px solid var(--rule);
    padding: 0.35rem 0.55rem;
    text-align: right;
    font-family: ui-monospace, monospace;
  }
  table.data-table th:first-child,
  table.data-table td:first-child {
    text-align: left;
  }
  table.data-table th {
    background: var(--panel-2);
    font-weight: 600;
  }
  .table-scroll {
    overflow: auto;
    max-height: 480px;
  }

  .empty-state {
    padding: 3rem 1rem;
    text-align: center;
    color: var(--ink-faint);
  }

  .tabs {
    display: flex;
    gap: 0.3rem;
    background: var(--panel-2);
    border: 1px solid var(--rule);
    border-radius: 5px;
    padding: 2px;
  }
  .tabs .btn {
    border: none;
    background: none;
    border-radius: 3px;
  }
  .tabs .btn.active {
    background: var(--panel);
    box-shadow: var(--shadow);
    color: var(--ink);
    font-weight: 600;
  }

  .traj-controls {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    flex-wrap: wrap;
    margin-bottom: 0.8rem;
    padding-bottom: 0.8rem;
    border-bottom: 1px solid var(--rule);
  }
  .traj-panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  @media (max-width: 780px) {
    .traj-panels {
      grid-template-columns: 1fr;
    }
  }
  .traj-head-note { color: var(--ink-faint); font-style: italic; }
  .traj-panel-head {
    font-size: 0.82rem;
    color: var(--ink-muted);
    margin-bottom: 0.4rem;
  }
  .traj-panel-head b {
    color: var(--ink);
    font-family: ui-monospace, monospace;
  }
  .traj-canvas-wrap {
    position: relative;
  }
  .traj-canvas-wrap canvas {
    width: 100%;
    height: 320px;
    display: block;
    cursor: crosshair;
  }
  .traj-legend {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 0.9rem;
    font-size: 0.74rem;
    color: var(--ink-muted);
    font-family: ui-monospace, monospace;
  }
  .traj-legend .ramp {
    flex: 1;
    height: 10px;
    border-radius: 3px;
    max-width: 320px;
  }
  .traj-legend .avg-swatch {
    display: inline-block;
    width: 22px;
    border-top: 3px dashed var(--ink);
    vertical-align: middle;
  }
</style>

<div class="app">
  <header class="topbar">
    <h1>Experiment Report</h1>
    <span class="meta" id="metaLine"></span>
    <div class="spacer"></div>
    <div class="field-inline">
      <span>metric</span>
      <select id="metricSelect"></select>
      <button type="button" class="help-dot" id="metricHelpBtn" aria-describedby="metricHelp"
              aria-label="What does this metric mean?">?</button>
      <div class="help-box" id="metricHelp" role="tooltip" hidden></div>
    </div>
    <div class="field-inline" id="tickField">
      <span>t = <b class="tabular" id="tickLabel">–</b></span>
      <input type="range" id="tickRange" min="0" max="0" value="0" step="1" />
    </div>
    <button
      class="btn"
      id="axesFlipBtn"
      title="Swap which parameter is shown on the horizontal vs vertical axis, across the heatmap, table, and trajectories"
    >
      ⇄ flip axes
    </button>
    <div class="tabs" id="viewTabs">
      <button class="btn active" id="tabHeatmap" data-view="heatmap">
        heatmap
      </button>
      <button class="btn" id="tabTable" data-view="table">table</button>
      <button class="btn" id="tabTrajectories" data-view="trajectories">
        trajectories
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <ul class="exp-list" id="expList"></ul>
      <div class="sidebar-section">
        <h3>Held fixed in this view</h3>
        <div id="fixedPanel"></div>
      </div>
    </aside>

    <main class="main">
      <!-- Set-level note, filled from manifest.setNote. Hidden unless the manifest
           carries one, so the sets that need no explanation are unchanged. -->
      <section class="panel set-note" id="setNote" hidden></section>
      <section class="panel" id="heatmapPanel">
        <div class="heatmap-head">
          <h2 id="heatmapTitle">—</h2>
          <span class="sub" id="heatmapSub"></span>
        </div>
        <div class="stats-strip" id="statsStrip"></div>
        <div class="table-toolbar" id="tableToolbar" style="display: none">
          <button type="button" id="copyLatexBtn" class="copy-btn"
                  title="Copy this table as a LaTeX tabular (booktabs + graphicx)">
            <!-- Two offset rounded rectangles: the conventional copy glyph. Inline
                 rather than an icon font or a data: URI, so the page stays one file. -->
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
              <rect x="5.5" y="5.5" width="9" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
              <path d="M10.5 3.5h-8a1.5 1.5 0 0 0-1.5 1.5v8" fill="none" stroke="currentColor" stroke-width="1.3"/>
            </svg>
            <span id="copyLatexLabel">Copy as LaTeX</span>
          </button>
        </div>
        <!-- Hidden in the table view, where #tableToolbar's LaTeX button is the export
             that makes sense; render() toggles the pair. -->
        <div class="fig-toolbar" id="heatmapImgToolbar">
          <button type="button" id="figCopyHeatmap" class="copy-btn" data-fig="heatmap" data-act="copy"

<script>
  const DATA = /*__REPORT_DATA__*/;

  const PRETTY = {
    turnoverRate: "turnover rate", learningRateSpread: "learning-rate spread",
    transferRate: "transfer rate", decayRate: "decay rate",
    aiDampeningBelow: "AI dampening (below)", aiDampeningAbove: "AI dampening (above)", aiLevelFraction: "AI level fraction",
    expertiseMean: "expertise mean (start)", entrantExpertiseMean: "entrant expertise mean",
    // Recruitment set. "retained", NOT "cut": the stored value is the share of retirements
    // still refilled, so 0 is the WORST cell and 0.9 the mildest. An axis labelled with the
    // bare parameter name reads backwards to anyone who assumes it counts the loss.
    recruitmentFraction: "hiring retained", recruitmentShockYears: "freeze duration (years)",
    // Entrant set. The mean already had an entry above; these two are its shape.
    entrantExpertiseSpread: "entrant expertise spread", entrantExpertiseFloor: "entrant expertise floor",
  };
  const SYMBOL = {
    turnoverRate: "r", learningRateSpread: "σ_L", transferRate: "β", decayRate: "δ",
    aiDampeningBelow: "γ_below", aiDampeningAbove: "γ_above", aiLevelFraction: "λ",
    expertiseMean: "μ_E", entrantExpertiseMean: "μ_ent",
    // Structure set (generate_structure_experiments.js).
    M: "M", graphAttachment: "m", frontierBreadth: "b",
    // Recruitment set (generate_recruitment_experiments.js).
    recruitmentFraction: "f_hire", recruitmentShockYears: "Y_freeze",
    // Entrant set (generate_entrant_experiments.js). mu_ent is already mapped above.
    entrantExpertiseSpread: "s_ent", entrantExpertiseFloor: "min_ent",
  };
  // These two are stored (in every config/CSV) as a raw multiplier on the learning
  // delta: 0..2, where 1 = unassisted rate. That's the right shape for the engine's
  // formula (delta *= value) but the wrong shape for a human to read, since 0 reads
  // backwards from what "dampening" suggests. DISPLAY-ONLY, shifted by -1 so it reads
  // on a natural -1..+1 scale (-1 = max dampening, 0 = neutral, +1 = max amplification)
  // wherever a human sees a value; every underlying array/select/comparison still uses
  // the raw 0..2 number so it stays consistent with the stored data.
  const DIRECTION_HINT = {
    aiDampeningBelow: "−1 = max dampening (learning zeroed out) · 0 = no effect · +1 = max amplification",
    aiDampeningAbove: "−1 = max dampening (learning zeroed out) · 0 = no effect · +1 = max amplification",
    // Runs the OPPOSITE way to severity, which is the whole reason it is spelled out: LOW is
    // the deep freeze. Stored as the retained share because that is what the engine
    // multiplies by, and left that way rather than displayed as its complement so the axis
    // still ascends with the number printed on it.
    recruitmentFraction: "share of retirements still refilled · 0 = total freeze (a 100% cut) · 0.9 = a 10% cut · 1 = normal hiring",
  };
  const DIRECTION_HINT_SHORT = {
    aiDampeningBelow: "(−1=max dampening, 0=neutral, +1=max amplified)",
    aiDampeningAbove: "(−1=max dampening, 0=neutral, +1=max amplified)",
    recruitmentFraction: "(0=total freeze, 0.9=10% cut, 1=normal hiring)",
  };

  // NOTE for archived data: results produced before 2026-08 carry an
  // aiRelianceIntensity column. It was a single dial deriving aiDampeningBelow =
  // 1 - rho and aiAtrophyMultiplier = 5^rho; both are recorded as their own columns
  // in those same files, so a historical CSV reads correctly without it. This
  // template no longer renders rho — see engine.js for why it was removed.
  // Removed 2026-08 with the observed-capability channel and the atrophy branch:
  // aiGain, aiResponseMode, aiAtrophyMultiplier, mobilityFriction,
  // entrantExpertiseSkew, and the meanC / gap metrics. Archived reports still carry
  // those columns; they simply render through the generic path now.
  const DAMPENING_KEYS = new Set(["aiDampeningBelow", "aiDampeningAbove"]);
  function pretty(key) { return PRETTY[key] || key.replace(/([A-Z])/g, " $1").toLowerCase(); }
  function sym(key) { return SYMBOL[key] || ""; }
  function prettyWithHint(key) { return pretty(key) + (DIRECTION_HINT_SHORT[key] ? " " + DIRECTION_HINT_SHORT[key] : ""); }
  function fmtNum(v) {
    if (v == null) return "—";
    const a = Math.abs(v);
    if (a !== 0 && a < 0.001) return v.toExponential(1);
    if (a < 1) return v.toFixed(a < 0.01 ? 4 : 3).replace(/0+$/, "").replace(/\.$/, "");
    return v.toFixed(2);
  }

  // fmtNum is right where there is room — a tooltip, a trajectory axis — and wrong
  // inside a heatmap cell, which can be 25px across. The metrics on offer now span
  // 1e-4 to 1.75e5, and fmtNum renders a capability shortfall as "175217.35": nine
  // characters into four characters of space, spilling across its neighbours until the
  // grid is unreadable. This caps every label at five characters at any magnitude.
  // Precision is not lost, only relocated — hover still reports the exact value.
  function fmtCell(v) {
    if (v == null) return "—";
    const a = Math.abs(v);
    if (a === 0) return "0";
    if (a >= 1e6) return (v / 1e6).toFixed(a >= 1e7 ? 0 : 1) + "M";
    if (a >= 1e3) return (v / 1e3).toFixed(a >= 1e5 ? 0 : 1) + "k";
    if (a >= 100) return v.toFixed(0);
    if (a >= 1) return v.toFixed(2);
    if (a >= 0.01) return v.toFixed(3);
    return v.toExponential(0);
  }
  // Decimal places are chosen PER PARAMETER — once, from every value that
  // parameter ever takes anywhere in the report — and then used for every label
  // on every chart.
  //
  // fmtNum picks precision from each value's own magnitude (4dp below 0.01, 3dp
  // above) and then strips trailing zeros. That is right for metrics, whose
  // magnitudes vary, but wrong for an axis: it rendered decayRate as
  // "0.005 0.0067 0.0085 0.01 0.012" — three precisions on one ruler — and made
  // the same parameter read differently from one chart to the next.
  //
  // The rule: the fewest decimals whose ROUNDING ERROR stays under a tenth of the
  // axis's own step. Distinctness alone is not enough — decayRate's 21 evenly
  // spaced values survive it at 3dp but print as "0.005 0.007 0.009 0.010 0.012",
  // making a uniform grid look unevenly spaced. Tying precision to the step
  // instead keeps the printed gaps faithful to the real ones.
  //
  // A parameter that only ever appears held-fixed has no step, so it falls back
  // to "within 0.5% of its own value", which also stops a small value like
  // turnoverRate = 0.00208 collapsing to "0".
  const AXIS_DECIMALS = (function () {
    const vals = new Map();
    const add = (k, v) => {
      if (typeof v !== "number" || !isFinite(v)) return;
      if (!vals.has(k)) vals.set(k, new Set());
      vals.get(k).add(DAMPENING_KEYS.has(k) ? v - 1 : v);
    };
    DATA.experiments.forEach((e) => {
      e.xValues.forEach((v) => add(e.xKey, v));
      e.yValues.forEach((v) => add(e.yKey, v));
      Object.keys(e.fixed || {}).forEach((k) => add(k, e.fixed[k]));
    });
    const out = {};
    vals.forEach((set, k) => {
      const arr = [...set].sort((a, b) => a - b);
      let tol;
      if (arr.length > 1) {
        let minGap = Infinity;
        for (let i = 1; i < arr.length; i++) minGap = Math.min(minGap, arr[i] - arr[i - 1]);
        tol = minGap / 10;
      } else {
        tol = Math.abs(arr[0]) * 0.005;
      }
      if (!(tol > 0)) tol = 1e-9;
      let d = 0;
      for (; d < 8; d++) {
        if (arr.every((v) => Math.abs(v - parseFloat(v.toFixed(d))) < tol)) break;
      }
      out[k] = d;
    });
    return out;
  })();

  // fmtAxis: use wherever a raw parameter value (not a metric) is displayed to a
  // human. Shifts aiDampeningBelow/Above by -1 for display and adds an explicit
  // "+" so the sign is never ambiguous.
  function fmtAxis(key, v) {
    if (v == null) return "—";
    if (typeof v !== "number") return String(v);
    const shifted = DAMPENING_KEYS.has(key) ? v - 1 : v;
    const d = AXIS_DECIMALS[key];
    const s = d == null ? fmtNum(shifted) : shifted.toFixed(d);
    return DAMPENING_KEYS.has(key) && shifted > 1e-9 ? "+" + s : s;
  }
  // Some held-fixed values are categorical (mobilityMode, aiResponseMode), not numeric
  // — fmtAxis/fmtNum assume a number, so route non-numbers straight through as text.
  function fmtAny(key, v) { return typeof v === "number" ? fmtAxis(key, v) : String(v); }

  // Plain, descriptive one-line explanations for each of the eleven study parameters —
  // what the number controls, not what it's good for. Used only in the per-figure
  // caption below each chart; kept deliberately neutral, not persuasive.
  const PARAM_EXPLAIN = {
    turnoverRate: "the fraction of the population replaced with new entrants each simulated tick.",
    learningRateSpread: "how much individual humans differ from one another in how quickly they learn from peers.",
    transferRate: "how quickly a human's expertise moves toward their institution's average, for humans below that average.",
    decayRate: "how quickly a human's expertise moves toward their institution's average, for humans at or above that average.",
    aiDampeningBelow: "how much AI use reduces learning, for humans below the AI's reference level.",
    aiDampeningAbove: "how much AI use reduces learning, for humans at or above the AI's reference level.",
    // Corrected: this is a fraction of the single HIGHEST starting expertise, not the
    // median. The distinction matters because that maximum is 1.0 for any realistic
    // population size (problems.md P17), which makes lambda an absolute threshold on
    // the expertise scale rather than anything relative to where the field sits.
    aiLevelFraction: "the AI's reference level, as a fraction of the highest expertise in the starting population.",
    expertiseMean: "the average starting expertise of the population at the beginning of the simulation.",
    entrantExpertiseMean: "the average starting expertise of new entrants who replace departing humans during the simulation.",
    // Structure set: the shape of the institutional network rather than the behaviour
    // of the people in it.
    M: "how many institutions the population is divided between — with N fixed, more institutions means fewer people in each.",
    graphAttachment: "how many existing institutions each new one connects to as the network is built, which sets how densely connected it ends up.",
    frontierBreadth: "how much of the work falls inside the AI's competence, derived from the AI's level: lower widens that reach, higher narrows it.",
    // Recruitment set. Both are stated in the direction a reader will assume they run:
    // the freeze's LENGTH, and the share of hiring that SURVIVES it -- the second of which
    // decreases with severity, hence the explicit "0 is a total freeze".
    recruitmentShockYears: "how long the hiring freeze lasts, in years, beginning once the field has reached equilibrium.",
    recruitmentFraction: "the share of retirements still replaced during the freeze: 0 is a total freeze, 0.9 is a 10% cut, 1 is normal hiring.",
    // Entrant set. entrantExpertiseMean is explained above with the other AI-sweep axes.
    entrantExpertiseSpread: "how much new entrants differ from one another: a wide draw brings some in near the expert threshold and others at the floor.",
    entrantExpertiseFloor: "the lowest expertise a new entrant can arrive with; above the entrant mean it becomes the value nearly all of them arrive at.",
  };

  function buildFigureCaptions() {
    const exp = currentExperiment();
    const dxKey = axisKey(exp, "x"), dyKey = axisKey(exp, "y");
    const axisLines =
      '<div class="axis-line"><span class="sym">' + sym(dxKey) + "</span><b>" + pretty(dxKey) + "</b> — " + (PARAM_EXPLAIN[dxKey] || "") + "</div>" +
      '<div class="axis-line"><span class="sym">' + sym(dyKey) + "</span><b>" + pretty(dyKey) + "</b> — " + (PARAM_EXPLAIN[dyKey] || "") + "</div>";
    const otherKeys = Object.keys(exp.fixed).filter((k) => k !== exp.xKey && k !== exp.yKey);
    const kvList = otherKeys.map((k) => sym(k) + " " + pretty(k) + "=" + fmtAny(k, exp.fixed[k])).join(", ");
    const fixedLine = '<div class="fixed-line">All other parameters were held fixed at: <span class="kv">' + kvList + "</span>.</div>";
    // aclNoviceGain/aclExpertGain/aclNoviceDeficit/aclBlendSharpness never appear in
    // exp.fixed above (they are not part of any AI/structure sweep's baseFixed or
    // studyParams — see engine.js DEFAULT_PARAMS), so this is the ONE place a reader is
    // told capability numbers on this page assume the published Dell'Acqua effect sizes.
    // The ACL scenario set is excluded: there the assumption itself is what varies, and
    // each experiment already names its own variant via `label`.
    const aclLine = DATA.stem === "acl" ? "" :
      '<div class="fixed-line">Capability calculations assume Dell&rsquo;Acqua as published: ' +
      '+43% novice / +17% expert quality gain inside the AI\u2019s frontier, \u221219 point novice ' +
      'deficit outside it. See results_ACL.html for the weaker and null alternatives.</div>';
    const html = axisLines + fixedLine + aclLine;
    const heatmapCaption = document.getElementById("heatmapCaption");
    const trajCaption = document.getElementById("trajCaption");
    if (heatmapCaption) heatmapCaption.innerHTML = html;
    if (trajCaption) trajCaption.innerHTML = html;
  }

  const app = {
    expIndex: 0,
    metricKey: DATA.metrics[0].key,
    // The LAST recorded tick, not the first. Clicking an experiment already jumped to
    // the end; only the initial load did not, so the report opened on t=12 — one year
    // into a 120-year run, before anything has happened. Measured on the structure set,
    // that view showed capabilityLostFrac as uniformly NEGATIVE across every cell (AI
    // helping everywhere, range -0.13..-0.08) where the settled answer runs to +1.00.
    // An opening screen that says the opposite of the result is not a neutral default.
    tickIndex: DATA.experiments[0].ticks.length - 1,
    viewMode: "heatmap", // "heatmap" | "table" | "trajectories"
    trajFixAxis: "x", // which DISPLAY axis is held fixed per panel; the OTHER becomes the colored line fan
    trajValueA: null,
    trajValueB: null,
    // Swaps which of the experiment's two real parameters is shown as the DISPLAY x
    // vs y axis, across heatmap, table, and trajectories at once. A global view
    // preference, not per-experiment — deliberately not reset in onExperimentChange,
    // unlike trajValueA/B (which are specific values that may not exist in the next
    // experiment's axis).
    axesFlipped: false,
  };

  function currentExperiment() { return DATA.experiments[app.expIndex]; }

  /* ---------- sidebar ---------- */
  function buildExpList() {
    const ul = document.getElementById("expList");
    ul.innerHTML = "";
    DATA.experiments.forEach((exp, i) => {
      const li = document.createElement("li");
      li.className = "exp-item" + (i === app.expIndex ? " selected" : "");
      // A set whose experiments all share the same axis pair — a scenario set, where
      // what separates them is what was HELD FIXED — would otherwise render fifteen
      // identical rows. `label` in the manifest names the scenario; the axis pair is
      // still shown beneath it, because it is the same for every entry and a reader
      // still needs to know what they are looking at.
      li.innerHTML =
        '<span class="n">EXPERIMENT ' + exp.n + "</span>" +
        (exp.label ? '<span class="scenario">' + exp.label + "</span>" : "") +
        '<span class="pair"><span class="sym">' + sym(exp.xKey) + "</span>" + pretty(exp.xKey) +
        ' <span style="color:var(--ink-faint)">×</span> ' +
        '<span class="sym">' + sym(exp.yKey) + "</span>" + pretty(exp.yKey) + "</span>";
      li.addEventListener("click", () => { app.expIndex = i; app.tickIndex = currentExperiment().ticks.length - 1; onExperimentChange(); });
      ul.appendChild(li);
    });
  }

  function buildFixedPanel() {
    const exp = currentExperiment();
    const el = document.getElementById("fixedPanel");
    const studyKeys = [...new Set(DATA.experiments.flatMap((e) => [e.xKey, e.yKey]))];
    const held = studyKeys.filter((k) => k !== exp.xKey && k !== exp.yKey);
    el.innerHTML = held.map((k) => {
      const hint = DIRECTION_HINT[k] || "";
      return '<div class="fixed-kv"' + (hint ? ' title="' + hint.replace(/"/g, "&quot;") + '"' : "") +
        '><span><span class="sym">' + sym(k) + "</span>" + pretty(k) +
        (hint ? ' <span style="text-decoration:underline dotted;">ⓘ</span>' : "") +
        "</span><b>" + fmtAxis(k, exp.fixed[k]) + "</b></div>";
    }).join("") +
      // M is DERIVED from the world model when graphSource is "worldModel", so a config
      // cannot set it and a manifest may not carry it. build_report.js backfills it from
      // the results where every row agrees; where it still cannot, the population is the
      // only figure there is, and the label drops the slash rather than printing
      // "11322 / undefined" — which read as a broken build rather than an absent number.
      (exp.fixed.M == null
        ? '<div class="fixed-kv"><span>N</span><b>' + exp.fixed.N + "</b></div>"
        : '<div class="fixed-kv"><span>N / M</span><b>' + exp.fixed.N + " / " + exp.fixed.M + "</b></div>") +
      '<div class="fixed-kv"><span>replicates</span><b>' + DATA.replicates + "</b></div>";
  }

  /* ---------- controls ---------- */
  function buildMetricSelect() {
    const sel = document.getElementById("metricSelect");
    sel.innerHTML = DATA.metrics.map((m) => '<option value="' + m.key + '">' + m.label + "</option>").join("");
    sel.value = app.metricKey;
    sel.addEventListener("change", () => { app.metricKey = sel.value; syncMetricHelp(); render(); });

    const helpBtn = document.getElementById("metricHelpBtn");
    if (helpBtn && !helpBtn._wired) {
      helpBtn._wired = true;
      helpBtn.addEventListener("mouseenter", () => showMetricHelp(true));
      helpBtn.addEventListener("mouseleave", () => showMetricHelp(false));
      helpBtn.addEventListener("focus", () => showMetricHelp(true));
      helpBtn.addEventListener("blur", () => showMetricHelp(false));
      // Touch has no hover, so a tap has to latch it open.
      helpBtn.addEventListener("click", () => showMetricHelp(document.getElementById("metricHelp").hidden));
    }
    syncMetricHelp();
  }

  // The help follows whichever metric is selected, so the ? always describes what is on
  // screen rather than opening a list the reader has to search.
  function syncMetricHelp() {
    const box = document.getElementById("metricHelp"), btn = document.getElementById("metricHelpBtn");
    if (!box || !btn) return;
    const m = DATA.metrics.find((x) => x.key === app.metricKey);
    const help = m && m.help;
    // A ? that opens an empty box is worse than no ?. A report built before the help
    // text existed simply does not get one.
    btn.hidden = !help;
    if (!help) { box.hidden = true; return; }
    box.innerHTML = "<b>" + m.label + "</b>" + help;
  }

  function showMetricHelp(on) {
    const box = document.getElementById("metricHelp"), btn = document.getElementById("metricHelpBtn");
    if (!box || !btn || btn.hidden) return;
    box.hidden = !on;
    btn.setAttribute("aria-expanded", String(!!on));
  }

  function buildTickRange() {
    const range = document.getElementById("tickRange");
    const exp = currentExperiment();
    range.max = exp.ticks.length - 1;
    range.value = app.tickIndex;
    range.oninput = () => { app.tickIndex = parseInt(range.value, 10); render(); };
  }

  const VIEW_TABS = [
    { id: "tabHeatmap", mode: "heatmap" },
    { id: "tabTable", mode: "table" },
    { id: "tabTrajectories", mode: "trajectories" },
  ];
  VIEW_TABS.forEach(({ id, mode }) => {
    const btn = document.getElementById(id);
    btn.addEventListener("click", () => {
      app.viewMode = mode;
      VIEW_TABS.forEach((t) => document.getElementById(t.id).classList.toggle("active", t.mode === mode));
      document.getElementById("tickField").style.display = mode === "trajectories" ? "none" : "flex";
      if (mode === "trajectories") ensureTrajDefaults();
      render();
    });
  });

  // Swaps which of the experiment's two parameters is shown on the horizontal vs
  // vertical axis — heatmap, table, and both trajectory panels all read this via
  // axisKey/axisValues/cellField, so one toggle updates every view. trajValueA/B are
  // specific numeric values that belonged to whichever real axis was previously
  // "fixed"; forcing them to null (same pattern as onExperimentChange) makes
  // ensureTrajDefaults() re-derive valid ones for the newly-swapped axis instead of
  // silently keeping a stale value.
  const axesFlipBtn = document.getElementById("axesFlipBtn");
  axesFlipBtn.addEventListener("click", () => {
    app.axesFlipped = !app.axesFlipped;
    axesFlipBtn.classList.toggle("active", app.axesFlipped);
    app.trajValueA = null;
    app.trajValueB = null;
    buildFigureCaptions();
    render();
  });

  /* ---------- color ---------- */
  function hexToRgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function lerpRgb(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function rgbStr(c) { return "rgb(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + ")"; }

  function divergingColor(v, domain) {
    const zero = hexToRgb(cssVar("--diverge-zero"));
    if (v == null) return "transparent";
    const [min, max] = domain;
    if (v >= 0) {
      const mid = hexToRgb(cssVar("--diverge-pos-mid")), end = hexToRgb(cssVar("--diverge-pos-end"));
      const t = max > 0 ? clip01(v / max) : 0;
      return rgbStr(t < 0.5 ? lerpRgb(zero, mid, t * 2) : lerpRgb(mid, end, (t - 0.5) * 2));
    }
    const mid = hexToRgb(cssVar("--diverge-neg-mid")), end = hexToRgb(cssVar("--diverge-neg-end"));
    const t = min < 0 ? clip01(v / min) : 0;
    return rgbStr(t < 0.5 ? lerpRgb(zero, mid, t * 2) : lerpRgb(mid, end, (t - 0.5) * 2));
  }
  function clip01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function currentTheme() {
    const t = document.documentElement.getAttribute("data-theme");
    if (t === "dark" || t === "light") return t;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

  function renderLegend() {
    const domain = DATA.domains[app.metricKey];
    const [min, max] = domain;
    document.getElementById("legendMin").textContent = fmtCell(min);
    document.getElementById("legendMax").textContent = fmtCell(max);
    const stops = [];
    const N = 20;
    for (let i = 0; i <= N; i++) {
      const v = min + (max - min) * (i / N);
      stops.push(divergingColor(v, domain) + " " + ((i / N) * 100) + "%");
    }
    document.getElementById("legendRamp").style.background = "linear-gradient(90deg," + stops.join(",") + ")";
    const zeroPct = max > min ? clip01((0 - min) / (max - min)) * 100 : 50;
    document.getElementById("legendZero").style.left = zeroPct + "%";
  }

  /* ---------- panel statistics ---------- */
  // Six numbers about the grid currently on screen, recomputed per experiment, per
  // metric and per tick from the `stats` block build_report.js emits. See gridStats()
  // there for how each is defined and why the noise variance is subtracted out of the
  // signal SD.
  //
  // The badge is the point of the strip. A reader scanning twenty panels cannot hold a
  // noise floor in their head and compare it against a range; "no dynamics above noise"
  // is the same judgement made for them, and it is the judgement that stops a flat
  // surface being read as a finding because the colour ramp made it look like one.
  // fmtCell drops to exponential below 0.01, which is where every number in this strip
  // lives on the expertise metrics — "±8e-3" beside "-0.078" makes two quantities of
  // the same size look unrelated. Three significant figures in plain decimal down to
  // 1e-4, so the noise floor and the range can be compared by eye.
  function fmtStat(v) {
    if (v == null || !isFinite(v)) return "—";
    const a = Math.abs(v);
    if (a === 0) return "0";
    if (a >= 1e6) return (v / 1e6).toFixed(a >= 1e7 ? 0 : 1) + "M";
    if (a >= 1e3) return (v / 1e3).toFixed(a >= 1e5 ? 0 : 1) + "k";
    if (a >= 100) return v.toFixed(0);
    if (a >= 1) return v.toFixed(2);
    // parseFloat round-trips off the trailing zeros toPrecision leaves behind:
    // "0.00834", not "0.008340", so the strip stays scannable.
    if (a >= 1e-4) return String(parseFloat(v.toPrecision(3)));
    return v.toExponential(1);
  }

  // The set-level note. HTML from the manifest, not escaped, because it is authored in
  // the generator alongside the experiment definitions -- the same trust level as the
  // metric help strings above, and for the same reason: it has to carry emphasis and a
  // collapsible block to be readable at all. Nothing here comes from a CSV.
  function renderSetNote() {
    const el = document.getElementById("setNote");
    if (!el) return;
    // A linked notes page takes precedence over an inline block. Method notes belong
    // beside the numbers but not in front of them: a panel of prose above the grid is
    // read once and skipped on every load afterwards, at which point it is only taking
    // up the space the figure should have.
    if (DATA.notesHref) {
      el.innerHTML = '<p style="margin:0"><a href="' + DATA.notesHref + '">'
        + (DATA.notesTitle || "Notes on this set") + "</a>"
        + " \u2014 what is varied, why these axes, and how the numbers are measured.</p>";
      el.hidden = false;
      return;
    }
    if (!DATA.setNote) return;
    el.innerHTML = DATA.setNote;
    el.hidden = false;
  }

  /* ---------- figure export: PNG to clipboard or to file ---------- */
  // The heatmap and trajectory panels are <canvas>, so the pixels are already there and
  // there is no rasterising to do. What IS missing from a bare canvas is everything the
  // page draws in HTML around it: the title, and — for the heatmap — the colour ramp
  // without which the image cannot be read at all. So the export COMPOSITES: title,
  // subtitle, the canvas, a redrawn legend, and a provenance footer, onto an opaque
  // background. A transparent PNG pasted into a light document with a dark-theme figure
  // in it is unreadable, which is why the background is painted rather than left clear.
  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#ffffff";
  }

  // Describes one exportable figure. Kept as a lookup rather than three near-identical
  // handlers so the button wiring below is one delegated listener.
  function figureSpec(kind) {
    const exp = currentExperiment();
    const metric = DATA.metrics.find((m) => m.key === app.metricKey);
    // CLAMPED. app.tickIndex belongs to whichever experiment was last rendered, and
    // experiments in a set need not share a tick list -- switching to a shorter one leaves
    // the index past its end, and an unguarded read put the literal string "undefined" in
    // the exported filename and footer. Caught by the export test, which is the only place
    // it would ever have shown up.
    const t = exp.ticks[Math.min(Math.max(app.tickIndex, 0), exp.ticks.length - 1)];
    const stem = (DATA.stem || "report") + "-exp" + exp.n;
    const foot = DATA.stem + " · experiment " + exp.n + " · "
      + pretty(axisKey(exp, "x")) + " × " + pretty(axisKey(exp, "y"))
      + " · t=" + t + " · " + DATA.replicates + " replicates · generated " + DATA.generatedAt;
    if (kind === "heatmap") {
      const domain = DATA.domains[app.metricKey];
      return {
        canvas: document.getElementById("heatmapCanvas"),
        title: metric.label,
        subtitle: document.getElementById("heatmapSub").textContent,
        foot: foot,
        legend: { min: fmtCell(domain[0]), max: fmtCell(domain[1]),
                  color: (f) => divergingColor(domain[0] + (domain[1] - domain[0]) * f, domain) },
        file: stem + "-" + app.metricKey + "-t" + t + ".png",
      };
    }
    const which = kind === "trajA" ? "A" : "B";
    const isDark = currentTheme() === "dark";
    return {
      canvas: document.getElementById("trajCanvas" + which),
      title: metric.label + " over time",
      subtitle: document.getElementById("trajHead" + which).textContent,
      foot: foot,
      legend: { min: document.getElementById("trajLegendMin").textContent,
                max: document.getElementById("trajLegendMax").textContent,
                label: document.getElementById("trajLegendLabel").textContent,
                color: (f) => seqRamp(f, isDark) },
      file: stem + "-" + app.metricKey + "-t" + t + "-panel" + which + ".png",
    };
  }

  // Composites at the SOURCE canvas's device pixel ratio, so an export from a retina
  // screen is not silently downsampled and one from a 1x screen is not upscaled into
  // blur. All layout below is in CSS pixels and scaled once at the end.
  function composeFigure(spec) {
    const src = spec.canvas;
    const dpr = window.devicePixelRatio || 1;
    const cw = src.width / dpr, chh = src.height / dpr;
    const pad = 14, titleH = 22, subH = spec.subtitle ? 16 : 0, legH = spec.legend ? 30 : 0, footH = 16;
    const W = cw + pad * 2, H = pad + titleH + subH + chh + legH + footH + pad;
    const out = document.createElement("canvas");
    out.width = Math.round(W * dpr); out.height = Math.round(H * dpr);
    const c = out.getContext("2d");
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.fillStyle = cssVar("--panel"); c.fillRect(0, 0, W, H);
    const ink = cssVar("--ink"), muted = cssVar("--ink-muted");
    const font = 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    let y = pad;
    c.textAlign = "left"; c.textBaseline = "top";
    c.fillStyle = ink; c.font = "600 14px " + font;
    c.fillText(spec.title, pad, y); y += titleH;
    if (spec.subtitle) { c.fillStyle = muted; c.font = "11px " + font; c.fillText(spec.subtitle, pad, y); y += subH; }
    // The canvas itself. drawImage takes the backing store, so this is a pixel copy at
    // full resolution rather than a re-render.
    c.drawImage(src, 0, 0, src.width, src.height, pad, y, cw, chh);
    y += chh;
    if (spec.legend) {
      const rampY = y + 8, rampH = 9, labelW = 62;
      const x0 = pad + labelW, x1 = W - pad - labelW;
      for (let px = x0; px < x1; px++) {
        c.fillStyle = spec.legend.color((px - x0) / (x1 - x0));
        c.fillRect(px, rampY, 1, rampH);
      }
      c.strokeStyle = cssVar("--rule"); c.lineWidth = 1;
      c.strokeRect(x0 + 0.5, rampY + 0.5, x1 - x0 - 1, rampH - 1);
      c.fillStyle = muted; c.font = "10px " + font;
      c.textAlign = "right"; c.fillText(spec.legend.min, x0 - 6, rampY - 1);
      c.textAlign = "left"; c.fillText(spec.legend.max, x1 + 6, rampY - 1);
      if (spec.legend.label) { c.textAlign = "center"; c.fillText(spec.legend.label, W / 2, rampY + rampH + 2); }
      y += legH;
    }
    // Provenance. An exported figure outlives the page it came from, and a heatmap with
    // no tick or replicate count on it is not something anyone can check later.
    c.textAlign = "left"; c.fillStyle = muted; c.font = "9px " + font;
    c.fillText(spec.foot, pad, H - pad - 9);
    return out;
  }

  function figureBlob(spec) {
    return new Promise((resolve, reject) => {
      composeFigure(spec).toBlob((b) => (b ? resolve(b) : reject(new Error("toBlob returned null"))), "image/png");
    });
  }

  // Feedback goes on the button that was pressed. Both paths can fail for reasons the
  // reader can do nothing about — see the copy handler — so silence is not an option.
  // Takes the label element, not the button: this page addresses everything by id, and
  // querySelector would be the only structural DOM query in it — see the export binding
  // below for why that matters.
  function flashButton(btn, label, text) {
    if (!label) return;
    const was = label.textContent;
    label.textContent = text;
    btn.classList.add("ok");
    setTimeout(() => { label.textContent = was; btn.classList.remove("ok"); }, 2000);
  }

  function copyFigure(spec, btn, label) {
    // ClipboardItem is given the PROMISE, not an awaited blob: Safari drops the user
    // activation that authorises a clipboard write if you await anything first, and the
    // promise form is what its API is designed around. Chrome accepts it too.
    //
    // This fails in two situations worth telling the reader apart from a bug: a browser
    // without image clipboard support, and any browser on file:// — which is not a secure
    // context, so navigator.clipboard is simply absent. Downloading still works there,
    // which is what the message points at.
    if (!(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write)) {
      flashButton(btn, label, "Use Download");
      return;
    }
    try {
      const item = new ClipboardItem({ "image/png": figureBlob(spec) });
      navigator.clipboard.write([item]).then(
        () => flashButton(btn, label, "Copied"),
        () => flashButton(btn, label, "Use Download"));
    } catch (e) {
      flashButton(btn, label, "Use Download");
    }
  }

  function saveFigure(spec, btn, label) {
    figureBlob(spec).then((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = spec.file;
      document.body.appendChild(a); a.click(); a.remove();
      // Revoked on the next turn of the event loop: revoking synchronously can beat the
      // download starting in some browsers.
      setTimeout(() => URL.revokeObjectURL(url), 0);
      flashButton(btn, label, "Saved");
    }, () => flashButton(btn, label, "Failed"));
  }

  // Bound per button at boot, not delegated from document. These six buttons are static
  // markup — render() never recreates them — so there is nothing for delegation to buy,
  // and a document-level listener would also need Element.closest, which is more DOM than
  // this page otherwise depends on.
  // Addressed by id rather than by a [data-fig] selector: getElementById is the only
  // lookup this page uses anywhere, and keeping it that way is what lets the DOM stub in
  // src/test/ stay a few hundred lines instead of a DOM implementation.
  [["figCopyHeatmap", "heatmap", "copy"], ["figSaveHeatmap", "heatmap", "save"],
   ["figCopyTrajA", "trajA", "copy"], ["figSaveTrajA", "trajA", "save"],
   ["figCopyTrajB", "trajB", "copy"], ["figSaveTrajB", "trajB", "save"]].forEach(([id, fig, act]) => {
    const btn = document.getElementById(id);
    const label = document.getElementById(id + "Label");
    if (!btn) return;
    btn.addEventListener("click", () => {
      const spec = figureSpec(fig);
      // The trajectory canvases have no pixels until that view has been opened once, and
      // a 0x0 canvas exports a blank PNG rather than failing. Caught here.
      if (!spec.canvas || !spec.canvas.width) { flashButton(btn, label, "Nothing drawn"); return; }
      if (act === "copy") copyFigure(spec, btn, label);
      else saveFigure(spec, btn, label);
    });
  });

  function renderStatsStrip() {
    const el = document.getElementById("statsStrip");
    if (!el) return;
    const exp = currentExperiment();
    const st = exp.stats && exp.stats[app.metricKey];
    const i = app.tickIndex;
    if (!st || st.mean[i] == null) { el.style.display = "none"; return; }
    el.style.display = "flex";

    const mean = st.mean[i], lo = st.min[i], hi = st.max[i];
    const sem = st.sem[i], sd = st.sd[i], sn = st.sn[i];
    const reps = exp.reps != null ? exp.reps : null;

    const parts = [
      'mean <b>' + fmtStat(mean) + "</b>",
      "range <b>" + fmtStat(lo) + " … " + fmtStat(hi) + "</b>",
    ];
    // sem null means one replicate per cell — the noise floor was never measured, which
    // is a different statement from "the noise is zero" and has to read as one.
    if (sem == null) {
      parts.push('noise <b title="one replicate per cell — no repeat runs to measure seed scatter against">not measured</b>');
      parts.push("spread <b>" + fmtStat(sd) + "</b>");
    } else {
      parts.push("noise <b>±" + fmtStat(2 * sem) + "</b>"
        + (reps ? ' <span title="standard error of a single cell, at 2σ, pooled over the grid">(2σ, '
          + reps + " reps)</span>" : ""));
      parts.push('signal SD <b title="spread of cell means with the replicate noise variance removed">'
        + fmtStat(sd) + "</b>");
    }
    let badge = "";
    if (sn != null) {
      const cls = sn < 2 ? "sn-flat" : sn < 6 ? "sn-weak" : "sn-strong";
      const text = sn < 2 ? "no dynamics above noise" : sn < 6 ? "weak signal" : "clear signal";
      badge = '<span class="sn-badge ' + cls + '" title="signal SD divided by the single-cell standard error">'
        + "S/N " + sn.toFixed(1) + " · " + text + "</span>";
    }
    // One <span> per figure so the strip's flex gap does the spacing and the whole row
    // wraps cleanly on a narrow viewport instead of breaking mid-number.
    el.innerHTML = parts.map((p) => "<span>" + p + "</span>").join("") + badge;
  }

  /* ---------- heatmap ---------- */
  // Shared by the heatmap and both trajectory tooltips. Positioned to the lower-right of
  // the cursor by default, but flipped to whichever side keeps the box fully inside its
  // wrap element — a tooltip is placed by evt.clientX offset with no clamp otherwise, and
  // near the right or bottom edge of a wide canvas (the recruitment report's long
  // "hiring retained" / "AI dampening (below)" labels make the box wide enough for this
  // to matter) that placement pushed part of the box outside the visible area.
  //
  // Measured AFTER innerHTML is set, not assumed: the box's width depends on which labels
  // it happens to be showing, so a fixed offset budget would either clip a long tooltip or
  // waste space around a short one.
  function positionTooltip(tt, wrapRect, evt) {
    const w = tt.offsetWidth, h = tt.offsetHeight;
    const cx = evt.clientX - wrapRect.left, cy = evt.clientY - wrapRect.top;
    const fitsRight = cx + 14 + w <= wrapRect.width;
    const left = fitsRight ? cx + 14 : Math.max(0, cx - 14 - w);
    const fitsBelow = cy - 10 + h <= wrapRect.height;
    const top = fitsBelow ? Math.max(0, cy - 10) : Math.max(0, cy - 10 - h);
    tt.style.left = left + "px";
    tt.style.top = top + "px";
  }

  let hoverCell = null;
  let tooltipEl = null;
  function ensureTooltip() {
    if (tooltipEl) return tooltipEl;
    tooltipEl = document.createElement("div");
    tooltipEl.className = "chart-tooltip";
    tooltipEl.hidden = true;
    document.getElementById("heatmapWrap").appendChild(tooltipEl);
    return tooltipEl;
  }

  // xi/yi are DISPLAY grid indices (0..nx-1 / 0..ny-1 along whatever's currently
  // shown horizontal/vertical) — resolved to the real x/y via axisValues/cellField so
  // this works the same whether or not axes are flipped.
  //
  // The payload is COLUMNAR: exp.m[metric] is one flat array indexed
  // (realXi * nYValues + realYi) * nTicks + tickIndex. Cells are no longer
  // stored as objects — 2.9M of them at 21x21x120x55 overflowed the max string
  // length in build_report.js — so these helpers do the indexing that
  // exp.cells.find() used to do by linear scan (also ~50,000x fewer comparisons
  // per lookup).
  function realIndices(dxi, dyi) { return realAxisOf("x") === "x" ? [dxi, dyi] : [dyi, dxi]; }
  function flatIndex(exp, rxi, ryi, ti) { return (rxi * exp.yValues.length + ryi) * exp.ticks.length + ti; }

  // --- cell codes: a short reference number for every cell, dereferenced by
  // simulator.html (see applyScenarioCode there and the writer in build_report.js) --
  // Same mapping build_report.js uses, kept in sync by hand rather than shared code —
  // both sides are ~one line and a build-time/runtime split makes sharing more trouble
  // than it saves.
  const PREFIX_BY_STEM = { experiment: "AI", structure: "STR", acl: "CAP" };
  const REPORT_PREFIX = PREFIX_BY_STEM[DATA.stem] || "X";
  // Cumulative cell count before each experiment, in DATA.experiments' own order — the
  // same order build_report.js iterated in when it wrote startOffset into cell-index.js,
  // so a code computed here and a code looked up there name the same cell.
  const CELL_OFFSETS = (function () {
    let acc = 0;
    return DATA.experiments.map((e) => { const off = acc; acc += e.xValues.length * e.yValues.length; return off; });
  })();
  // 1-based, xi outer / yi inner, using REAL (unflipped) indices — a code must mean the
  // same cell regardless of which axis the reader currently has on which side.
  function codeForRealCell(expArrIdx, rxi, ryi) {
    const exp = DATA.experiments[expArrIdx];
    return REPORT_PREFIX + "-" + (CELL_OFFSETS[expArrIdx] + rxi * exp.yValues.length + ryi + 1);
  }

  // Single metric value at a DISPLAY grid position and tick index.
  function metricAt(exp, dxi, dyi, ti, key) {
    const [rxi, ryi] = realIndices(dxi, dyi);
    const a = exp.m[key];
    return a ? a[flatIndex(exp, rxi, ryi, ti)] : null;
  }

  // Materialises ONE cell on demand, in the shape the tooltip expects (real x/y
  // coordinates, so cellField can re-apply the flip).
  function cellAt(exp, dxi, dyi, t) {
    const ti = exp.ticks.indexOf(t);
    if (ti < 0) return null;
    const [rxi, ryi] = realIndices(dxi, dyi);
    const p = flatIndex(exp, rxi, ryi, ti);
    const cell = {
      x: exp.xValues[rxi], y: exp.yValues[ryi], t,
      n: exp.reps != null ? exp.reps : (exp.repsPerCell ? exp.repsPerCell[p] : null),
    };
    DATA.metrics.forEach((m) => { cell[m.key] = exp.m[m.key] ? exp.m[m.key][p] : null; });
    return cell;
  }

  // What the y axis of a trajectory panel actually measures. Metric-dependent, because
  // a shortfall is a difference against the paired no-AI run while a baseline or a
  // leverage is a level — one label cannot honestly describe both.
  function trajAxisTitle(key) {
    // Signed as the CHANGE now: below zero is what AI cost, above is what it added. The
    // cue therefore runs "lost" first (the bottom of the rotated axis) and "gained"
    // last, which is the opposite way round from the old shortfall convention.
    if (/_change$|ChangeFrac$/.test(key)) {
      return "\u2212 AI cost the field \u00b7 against the same world without AI \u00b7 AI added +";
    }
    const m = DATA.metrics.find((x) => x.key === key);
    return m ? m.label : key;
  }

  function drawHeatmap() {
    const exp = currentExperiment();
    const canvas = document.getElementById("heatmapCanvas");
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = rect.width, h = rect.height;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const t = exp.ticks[app.tickIndex];
    const pad = { l: 90, r: 16, t: 10, b: 46 };
    const plotW = w - pad.l - pad.r, plotH = h - pad.t - pad.b;
    const dispXValues = axisValues(exp, "x"), dispYValues = axisValues(exp, "y");
    const dispXKey = axisKey(exp, "x"), dispYKey = axisKey(exp, "y");
    const nx = dispXValues.length, ny = dispYValues.length;
    const cw = plotW / nx, ch = plotH / ny;
    const domain = DATA.domains[app.metricKey];

    ctx.textAlign = "center"; ctx.textBaseline = "middle";

    // A grid can be anywhere from 5x5 to 21x21 depending on the experiment, so the
    // label has to shrink with the cell rather than sit at a fixed 11px inside a 25px
    // box. Floored at 8px: below that it is texture, not text.
    const cellFont = Math.max(8, Math.min(11, Math.floor(Math.min(ch * 0.52, cw * 0.30))));
    ctx.font = cellFont + "px ui-monospace, SF Mono, Menlo, Consolas, monospace";
    const showCellLabels = cw >= 22 && ch >= 14;

    for (let xi = 0; xi < nx; xi++) {
      for (let yi = 0; yi < ny; yi++) {
        const cx = pad.l + xi * cw, cy = pad.t + (ny - 1 - yi) * ch; // y grows upward
        const v = metricAt(exp, xi, yi, app.tickIndex, app.metricKey);
        ctx.fillStyle = divergingColor(v, domain);
        const gap = Math.min(2, cw * 0.08, ch * 0.08);
        roundRect(ctx, cx + gap / 2, cy + gap / 2, cw - gap, ch - gap, Math.min(3, cw / 4));
        ctx.fill();
        if (hoverCell && hoverCell.xi === xi && hoverCell.yi === yi) {
          ctx.strokeStyle = cssVar("--ink"); ctx.lineWidth = 1.5;
          roundRect(ctx, cx + gap / 2, cy + gap / 2, cw - gap, ch - gap, Math.min(3, cw / 4));
          ctx.stroke();
        }
        if (showCellLabels && v != null) {
          const label = fmtCell(v);
          // MEASURED, not assumed from the cell width. The old gate guessed that a
          // 30px cell fits any label, which held while every metric lived in [-1, 1]
          // and stopped holding the moment capability arrived. A label that would
          // still overflow its own cell is dropped rather than drawn over its
          // neighbours.
          if (ctx.measureText(label).width <= cw - 4) {
            ctx.fillStyle = readableTextOn(v, domain);
            ctx.fillText(label, cx + cw / 2, cy + ch / 2);
          }
        }
      }
    }

    // axis tick labels — thin out to roughly a dozen when the grid is fine-grained,
    // so labels never overlap; the last tick is always kept so the range end is visible.
    ctx.fillStyle = cssVar("--ink-muted");
    ctx.font = "11px ui-monospace, SF Mono, Menlo, Consolas, monospace";
    const xStride = Math.max(1, Math.ceil(nx / 12));
    const yStride = Math.max(1, Math.ceil(ny / 12));
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    dispXValues.forEach((v, xi) => {
      if (xi % xStride !== 0 && xi !== nx - 1) return;
      ctx.fillText(fmtAxis(dispXKey, v), pad.l + xi * cw + cw / 2, pad.t + plotH + 8);
    });
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    dispYValues.forEach((v, yi) => {
      if (yi % yStride !== 0 && yi !== ny - 1) return;
      ctx.fillText(fmtAxis(dispYKey, v), pad.l - 10, pad.t + (ny - 1 - yi) * ch + ch / 2);
    });

    ctx.fillStyle = cssVar("--ink-faint");
    ctx.font = "10px ui-sans-serif, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.fillText(prettyWithHint(dispXKey) + " →", pad.l + plotW / 2, pad.t + plotH + 24);
    ctx.save();
    ctx.translate(16, pad.t + plotH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.fillText(prettyWithHint(dispYKey) + " →", 0, 0);
    ctx.restore();

    canvas._hit = { pad, cw, ch, nx, ny, exp, t };
  }

  function readableTextOn(v, domain) {
    if (v == null) return "transparent";
    const [min, max] = domain;
    const mag = v >= 0 ? (max > 0 ? Math.abs(v / max) : 0) : (min < 0 ? Math.abs(v / min) : 0);
    return mag > 0.55 ? "rgba(255,255,255,0.92)" : cssVar("--ink");
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function hitTest(canvas, evt) {
    const hit = canvas._hit;
    if (!hit) return null;
    const rect = canvas.getBoundingClientRect();
    const x = evt.clientX - rect.left, y = evt.clientY - rect.top;
    const xi = Math.floor((x - hit.pad.l) / hit.cw);
    const yiFromTop = Math.floor((y - hit.pad.t) / hit.ch);
    const yi = hit.ny - 1 - yiFromTop;
    if (xi < 0 || xi >= hit.nx || yi < 0 || yi >= hit.ny) return null;
    return { xi, yi };
  }

  const heatmapCanvas = document.getElementById("heatmapCanvas");
  heatmapCanvas.addEventListener("mousemove", (evt) => {
    const hit = hitTest(heatmapCanvas, evt);
    hoverCell = hit;
    const tt = ensureTooltip();
    if (!hit) { tt.hidden = true; drawHeatmap(); return; }
    const exp = currentExperiment();
    const cell = cellAt(exp, hit.xi, hit.yi, exp.ticks[app.tickIndex]);
    if (!cell) { tt.hidden = true; drawHeatmap(); return; }
    const [rxi, ryi] = realIndices(hit.xi, hit.yi);
    const code = codeForRealCell(app.expIndex, rxi, ryi);
    const rows = DATA.metrics.map((m) =>
      '<div class="row"><span>' + m.label + "</span><span>" + fmtNum(cell[m.key]) + "</span></div>"
    ).join("");
    tt.innerHTML =
      '<div class="row code-row"><span>code</span><span>' + code + "</span></div>" +
      '<div class="row"><b>' + pretty(axisKey(exp, "x")) + "</b><span>" + fmtAxis(axisKey(exp, "x"), cellField(cell, "x")) + "</span></div>" +
      '<div class="row"><b>' + pretty(axisKey(exp, "y")) + "</b><span>" + fmtAxis(axisKey(exp, "y"), cellField(cell, "y")) + "</span></div>" +
      '<div class="row"><span>replicates</span><span>' + cell.n + "</span></div>" + rows;
    tt.hidden = false;
    positionTooltip(tt, document.getElementById("heatmapWrap").getBoundingClientRect(), evt);
    drawHeatmap();
  });
  heatmapCanvas.addEventListener("mouseleave", () => { hoverCell = null; if (tooltipEl) tooltipEl.hidden = true; drawHeatmap(); });

  // Clicking a cell opens the simulator set up to reproduce it, paused at t=0.
  //
  // BUILD-TIME, because the report has two homes with different layouts and a single
  // hardcoded path can only be right in one of them:
  //
  //   on disk        doc/report.html  ->  ../src/simulator.html
  //   on Pages       report.html      ->  index.html   (both at the site root)
  //
  // It was hardcoded to the first for as long as the published site carried no reports.
  // Now that it does, the wrong value here is not a broken link in the abstract — it is
  // every heatmap cell click 404ing. Set with build_report.js's --simulator-href.
  const SIMULATOR_HREF = DATA.simulatorHref;

  // The short code IS the link now: "#c=AI-482" is what simulator.html parses (see
  // applyScenarioCode there), and it looks up the same {fixed, xValues, yValues} this
  // page already has, rather than carrying all ~25 params in the URL itself. The old
  // form — every param spelled out in the hash — is still accepted by simulator.html for
  // anything that predates this, but no longer produced.
  function simulatorURLFor(expArrIdx, rxi, ryi) {
    const code = codeForRealCell(expArrIdx, rxi, ryi);
    return SIMULATOR_HREF + "#c=" + encodeURIComponent(code);
  }

  heatmapCanvas.style.cursor = "pointer";
  heatmapCanvas.addEventListener("click", (evt) => {
    const hit = hitTest(heatmapCanvas, evt);
    if (!hit) return;
    const [rxi, ryi] = realIndices(hit.xi, hit.yi);
    window.open(simulatorURLFor(app.expIndex, rxi, ryi), "_blank", "noopener");
  });

  /* ---------- table view ---------- */
  function renderTable() {
    const exp = currentExperiment();
    const t = exp.ticks[app.tickIndex];
    const wrap = document.getElementById("tableWrap");
    const dispXValues = axisValues(exp, "x"), dispYValues = axisValues(exp, "y");
    const dispXKey = axisKey(exp, "x"), dispYKey = axisKey(exp, "y");
    let html = '<table class="data-table"><thead><tr><th>' + pretty(dispYKey) + " \\ " + pretty(dispXKey) + "</th>";
    dispXValues.forEach((x) => { html += "<th>" + fmtAxis(dispXKey, x) + "</th>"; });
    html += "</tr></thead><tbody>";
    for (let yi = dispYValues.length - 1; yi >= 0; yi--) {
      html += "<tr><th>" + fmtAxis(dispYKey, dispYValues[yi]) + "</th>";
      for (let xi = 0; xi < dispXValues.length; xi++) {
        const v = metricAt(exp, xi, yi, app.tickIndex, app.metricKey);
        html += "<td>" + (v == null ? "—" : fmtNum(v)) + "</td>";
      }
      html += "</tr>";
    }
    html += "</tbody></table>";
    wrap.innerHTML = html;
  }

  /* ---------- table → LaTeX ---------- */
  // The page's SYMBOL map carries display glyphs ("σ_L", "γ_below") that are Unicode
  // text, not math — pasting them into a .tex file gives an inputenc error or a literal
  // underscore, depending on the engine. These are the same parameters written as real
  // math, so the copied table compiles as-is under pdflatex.
  const LATEX_SYMBOL = {
    turnoverRate: "r", learningRateSpread: "\\sigma_L", transferRate: "\\beta", decayRate: "\\delta",
    aiDampeningBelow: "\\gamma_{\\mathrm{below}}", aiDampeningAbove: "\\gamma_{\\mathrm{above}}",
    aiLevelFraction: "\\lambda",
    expertiseMean: "\\mu_E", entrantExpertiseMean: "\\mu_{\\mathrm{ent}}",
    M: "M", graphAttachment: "m", frontierBreadth: "b",
    // Recruitment set (generate_recruitment_experiments.js).
    recruitmentFraction: "f_{\\mathrm{hire}}", recruitmentShockYears: "Y_{\\mathrm{freeze}}",
    entrantExpertiseSpread: "\\sigma_{\\mathrm{ent}}", entrantExpertiseFloor: "E^{\\min}_{\\mathrm{ent}}",
  };
  // Escapes the ten characters TeX treats specially. Applied to every piece of PROSE
  // that reaches the output — parameter names, metric labels, captions — but never to
  // the math above or the numbers, which are already valid.
  function texEscape(s) {
    return String(s)
      .replace(/\\/g, "\\textbackslash{}")
      .replace(/([&%$#_{}])/g, "\\$1")
      .replace(/~/g, "\\textasciitilde{}")
      .replace(/\^/g, "\\textasciicircum{}")
      // The page speaks in typographic characters; TeX wants its own.
      .replace(/−/g, "$-$").replace(/–/g, "--").replace(/—/g, "---")
      .replace(/×/g, "$\\times$").replace(/·/g, "$\\cdot$")
      .replace(/…/g, "\\ldots{}").replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
  }
  // A column header, in math where the parameter has a symbol and as escaped text
  // otherwise — so an axis this report has never seen still comes out compilable.
  function texAxisName(key) {
    const s = LATEX_SYMBOL[key];
    return (s ? "$" + s + "$ " : "") + texEscape(pretty(key));
  }
  // fmtNum's exponential ("-1.2e-4") is JavaScript notation, not maths. Everything else
  // it produces is already a plain decimal and passes through untouched.
  function texNum(v) {
    if (v == null) return "---";
    const body = texMath(v);
    return body === fmtNum(v) ? body : "$" + body + "$";
  }
  // The same number WITHOUT delimiters, for dropping into an existing math group. Keeping
  // these separate is not fussiness: "$\pm$" + texNum(x) produced "$\pm$$6.0 \times
  // 10^{-4}$", two adjacent math groups, which typesets with a spurious gap.
  function texMath(v) {
    if (v == null) return "---";
    const s = fmtNum(v);
    const m = /^(-?[\d.]+)e([+-]?\d+)$/.exec(s);
    return m ? m[1] + " \\times 10^{" + parseInt(m[2], 10) + "}" : s;
  }

  // The whole table as a standalone float. Deliberately a complete `table` environment
  // rather than a bare `tabular`: the caption is where the tick, the replicate count and
  // the noise floor go, and a grid copied without those is exactly the decontextualised
  // number this report has been trying to stop people quoting.
  //
  // \resizebox because these grids run to 21 columns and overrun \textwidth at any
  // readable font size. It needs graphicx; the rules need booktabs. Both are named in a
  // comment at the top of the output so a paste into a fresh document says what it wants.
  function tableToLatex() {
    const exp = currentExperiment();
    const t = exp.ticks[app.tickIndex];
    const metric = DATA.metrics.find((x) => x.key === app.metricKey);
    const dispXValues = axisValues(exp, "x"), dispYValues = axisValues(exp, "y");
    const dispXKey = axisKey(exp, "x"), dispYKey = axisKey(exp, "y");

    const L = [];
    // ASCII throughout, this provenance comment included: a .tex file carrying a stray
    // em dash is an inputenc error under pdflatex, and the report's own prose is full of
    // typographic characters that must not follow the numbers out.
    L.push("% " + texEscape(DATA.stem) + "." + exp.n + ": generated by build_report.js, "
      + DATA.generatedAt);
    L.push("% requires: \\usepackage{booktabs,graphicx}");
    L.push("\\begin{table}[htbp]");
    L.push("  \\centering");

    // Caption: what the numbers are, at what tick, over how many replicates, and how
    // much of what the reader sees is noise. Same figures as the on-screen stats strip.
    const st = exp.stats && exp.stats[app.metricKey];
    const i = app.tickIndex;
    let caption = texEscape(metric ? metric.label : app.metricKey)
      + " at $t=" + t + "$ months, "
      + texAxisName(dispYKey) + " (rows) against " + texAxisName(dispXKey) + " (columns).";
    if (st && st.mean[i] != null) {
      caption += " Grid mean " + texNum(st.mean[i])
        + ", range " + texNum(st.min[i]) + " to " + texNum(st.max[i]) + ".";
      if (st.sem[i] != null) {
        caption += " Single-cell noise $\\pm " + texMath(2 * st.sem[i]) + "$ ($2\\sigma$"
          + (exp.reps ? ", " + exp.reps + " replicates" : "") + ")";
        if (st.sn[i] != null) {
          caption += "; signal-to-noise " + st.sn[i].toFixed(1)
            + (st.sn[i] < 2 ? ", i.e. no variation above the replicate noise" : "");
        }
        caption += ".";
      }
    }
    L.push("  \\caption{" + caption + "}");
    L.push("  \\label{tab:" + DATA.stem + "-" + exp.n + "-" + app.metricKey.replace(/_/g, "-") + "-t" + t + "}");
    L.push("  \\resizebox{\\textwidth}{!}{%");
    L.push("  \\begin{tabular}{l" + "r".repeat(dispXValues.length) + "}");
    L.push("    \\toprule");
    L.push("    " + texAxisName(dispYKey) + " $\\backslash$ " + texAxisName(dispXKey)
      + " & " + dispXValues.map((x) => texEscape(fmtAxis(dispXKey, x))).join(" & ") + " \\\\");
    L.push("    \\midrule");
    // Rows top-down in the same order the on-screen table shows them (highest y first),
    // so a reader comparing the two is looking at the same shape.
    for (let yi = dispYValues.length - 1; yi >= 0; yi--) {
      const cells = [];
      for (let xi = 0; xi < dispXValues.length; xi++) {
        cells.push(texNum(metricAt(exp, xi, yi, app.tickIndex, app.metricKey)));
      }
      L.push("    " + texEscape(fmtAxis(dispYKey, dispYValues[yi])) + " & " + cells.join(" & ") + " \\\\");
    }
    L.push("    \\bottomrule");
    L.push("  \\end{tabular}%");
    L.push("  }");
    L.push("\\end{table}");
    // Trailing newline: this lands in an editor at a cursor, and a file that ends
    // mid-line makes the next paste start on the same one.
    return L.join("\n") + "\n";
  }

  // navigator.clipboard is unavailable outside a secure context, and these reports are
  // routinely opened straight off disk — so the textarea fallback is the path that
  // actually runs for a lot of readers, not a legacy nicety. Failure is reported on the
  // button rather than swallowed: silently copying nothing is worse than saying so.
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise((resolve, reject) => {
      const ta = document.createElement("textarea");
      ta.value = text;
      // Off-screen rather than hidden: display:none and visibility:hidden are not
      // selectable, and execCommand("copy") copies the selection.
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      ta.setAttribute("readonly", "");
      document.body.appendChild(ta);
      try {
        ta.select();
        if (document.execCommand("copy")) resolve(); else reject(new Error("execCommand refused"));
      } catch (err) {
        reject(err);
      } finally {
        document.body.removeChild(ta);
      }
    });
  }

  let copyResetTimer = null;
  function copyTableAsLatex() {
    const btn = document.getElementById("copyLatexBtn");
    const label = document.getElementById("copyLatexLabel");
    if (!btn || !label) return;
    const done = (cls, text) => {
      btn.classList.remove("is-done", "is-fail");
      btn.classList.add(cls);
      label.textContent = text;
      clearTimeout(copyResetTimer);
