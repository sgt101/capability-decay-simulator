      copyResetTimer = setTimeout(() => {
        btn.classList.remove("is-done", "is-fail");
        label.textContent = "Copy as LaTeX";
      }, 2200);
    };
    let tex;
    try {
      tex = tableToLatex();
    } catch (err) {
      done("is-fail", "Could not build table");
      throw err;   // rethrown: a broken generator is a bug, not a user-facing outcome
    }
    copyText(tex).then(
      () => done("is-done", "Copied"),
      () => done("is-fail", "Copy blocked — select the table instead"));
  }

  /* ---------- axis resolution (shared by heatmap, table, and trajectories) ---------- */
  // "x"/"y" below always mean the DISPLAY axis (what's currently drawn horizontal vs
  // vertical); realAxisOf maps that to the experiment's actual xKey/yKey identity,
  // swapping when app.axesFlipped is on. Every place that used to read exp.xKey/
  // exp.yKey/exp.xValues/exp.yValues directly goes through these instead, so the flip
  // toggle only has to be implemented once.
  function otherAxis(axis) { return axis === "x" ? "y" : "x"; }
  function realAxisOf(axis) { return app.axesFlipped ? otherAxis(axis) : axis; }
  function axisKey(exp, axis) { return realAxisOf(axis) === "x" ? exp.xKey : exp.yKey; }
  function axisValues(exp, axis) { return realAxisOf(axis) === "x" ? exp.xValues : exp.yValues; }
  // Reads a cell's coordinate along a DISPLAY axis (cells are always stored keyed by
  // the real x/y, regardless of flip).
  function cellField(c, axis) { return realAxisOf(axis) === "x" ? c.x : c.y; }

  function ensureTrajDefaults() {
    const exp = currentExperiment();
    const vals = axisValues(exp, app.trajFixAxis);
    if (app.trajValueA == null || !vals.some((v) => Math.abs(v - app.trajValueA) < 1e-9)) app.trajValueA = vals[0];
    if (app.trajValueB == null || !vals.some((v) => Math.abs(v - app.trajValueB) < 1e-9)) app.trajValueB = vals[Math.floor(vals.length / 2)];
    buildTrajControls();
  }

  function buildTrajControls() {
    const exp = currentExperiment();
    const fixSel = document.getElementById("trajFixAxisSelect");
    fixSel.innerHTML =
      '<option value="x">' + sym(axisKey(exp, "x")) + " " + pretty(axisKey(exp, "x")) + "</option>" +
      '<option value="y">' + sym(axisKey(exp, "y")) + " " + pretty(axisKey(exp, "y")) + "</option>";
    fixSel.value = app.trajFixAxis;
    fixSel.onchange = () => {
      app.trajFixAxis = fixSel.value;
      const vals = axisValues(exp, app.trajFixAxis);
      app.trajValueA = vals[0];
      app.trajValueB = vals[Math.floor(vals.length / 2)];
      buildTrajControls();
      render();
    };

    const vals = axisValues(exp, app.trajFixAxis);
    const fixKeyForOptions = axisKey(exp, app.trajFixAxis);
    const optsHtml = vals.map((v) => '<option value="' + v + '">' + fmtAxis(fixKeyForOptions, v) + "</option>").join("");
    const selA = document.getElementById("trajValueASelect"), selB = document.getElementById("trajValueBSelect");
    selA.innerHTML = optsHtml; selA.value = app.trajValueA;
    selB.innerHTML = optsHtml; selB.value = app.trajValueB;
    selA.onchange = () => { app.trajValueA = parseFloat(selA.value); render(); };
    selB.onchange = () => { app.trajValueB = parseFloat(selB.value); render(); };
  }

  function trajSeries(exp, fixAxis, fixedValue, metricKey) {
    const vAxis = otherAxis(fixAxis);
    const vValues = axisValues(exp, vAxis);
    const byVarying = new Map();
    vValues.forEach((v) => byVarying.set(v, []));
    const fValues = axisValues(exp, fixAxis);
    const fi = fValues.findIndex((v) => Math.abs(v - fixedValue) < 1e-9);
    const arrM = exp.m[metricKey];
    if (fi >= 0 && arrM) {
      for (let vi = 0; vi < vValues.length; vi++) {
        const dxi = fixAxis === "x" ? fi : vi, dyi = fixAxis === "x" ? vi : fi;
        const [rxi, ryi] = realIndices(dxi, dyi);
        const base = flatIndex(exp, rxi, ryi, 0);
        const arr = byVarying.get(vValues[vi]);
        // exp.ticks is already ascending, so no sort is needed any more.
        for (let ti = 0; ti < exp.ticks.length; ti++) arr.push({ t: exp.ticks[ti], v: arrM[base + ti] });
      }
    }
    return { varyingKey: axisKey(exp, vAxis), varyingValues: vValues, series: byVarying };
  }

  function trajDomain(exp, fixAxis, valueA, valueB, metricKey) {
    let min = Infinity, max = -Infinity;
    const arrM = exp.m[metricKey];
    const vValues = axisValues(exp, otherAxis(fixAxis));
    const fValues = axisValues(exp, fixAxis);
    [valueA, valueB].forEach((fv) => {
      const fi = fValues.findIndex((v) => Math.abs(v - fv) < 1e-9);
      if (fi < 0 || !arrM) return;
      for (let vi = 0; vi < vValues.length; vi++) {
        const dxi = fixAxis === "x" ? fi : vi, dyi = fixAxis === "x" ? vi : fi;
        const [rxi, ryi] = realIndices(dxi, dyi);
        const base = flatIndex(exp, rxi, ryi, 0);
        for (let ti = 0; ti < exp.ticks.length; ti++) {
          const v = arrM[base + ti];
          if (v == null) continue;
          if (v < min) min = v;
          if (v > max) max = v;
        }
      }
    });
    if (!isFinite(min)) { min = 0; max = 1; }
    if (max - min < 1e-9) max = min + 1e-9;
    return [min, max];
  }

  // The trajectory line colours. Chosen against two measurable criteria rather than by
  // eye, because the previous ramp failed both at its low end and the failure only showed
  // up once these charts were being exported into papers and slides:
  //
  //   1. CONTRAST >= 3:1 against the panel behind it (the WCAG threshold for graphical
  //      objects). The old light ramp ran 89 -> 23 in L*, so its first three stops scored
  //      1.32, 1.79 and 2.50 against white — a thin line in the palest of them was
  //      invisible on paper. The new one is 3.10 at worst.
  //   2. ADJACENT SEPARATION >= 10 dE (CIE76), so neighbouring series stay tellable apart
  //      despite the compressed lightness range. The new ramp is 10.1 at worst.
  //
  // Compressing lightness alone would have satisfied (1) and broken (2), so the range is
  // narrowed from 66 L* points to 32 and the shortfall in separation is made up with hue,
  // rotating blue -> indigo across the scale. Lightness still decreases monotonically, so
  // the scale reads as ordered rather than as a rainbow.
  //
  // The two ramps are now INDEPENDENT rather than one reversed. Reversing put the darkest
  // colour at the low end on a near-black panel, which reproduced exactly the same
  // invisibility the light theme had — mirrored, and equally unnoticed.
  function seqRamp(t, isDark) {
    const lightRamp = ["#00A0BF", "#008FBA", "#007EB3", "#1F6CA7", "#385A97", "#474885", "#50366F"];
    const darkRamp = ["#00969B", "#00A4B7", "#25B0D2", "#52BCEA", "#7AC7FF", "#A2D1FF", "#CADAFF"];
    const ramp = isDark ? darkRamp : lightRamp;
    const idx = clip01(t) * (ramp.length - 1);
    const lo = Math.floor(idx), hi = Math.min(ramp.length - 1, lo + 1), frac = idx - lo;
    const c1 = hexToRgb(ramp[lo]), c2 = hexToRgb(ramp[hi]);
    return rgbStr(lerpRgb(c1, c2, frac));
  }

  const trajHover = { A: null, B: null };
  function drawTrajPanel(canvasId, exp, fixAxis, fixedValue, metricKey, yDomain, hoverKey) {
    const canvas = document.getElementById(canvasId);
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = rect.width, h = rect.height;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const { varyingValues, series } = trajSeries(exp, fixAxis, fixedValue, metricKey);
    const pad = { l: 58, r: 10, t: 10, b: 26 };
    const plotW = w - pad.l - pad.r, plotH = h - pad.t - pad.b;
    const ticks = exp.ticks;
    const t0 = ticks[0], t1 = ticks[ticks.length - 1];
    const [yMin, yMax] = yDomain;
    const toX = (t) => pad.l + ((t - t0) / Math.max(1, t1 - t0)) * plotW;
    const toY = (v) => (pad.t + plotH) - ((v - yMin) / (yMax - yMin)) * plotH;
    const isDark = currentTheme() === "dark";

    ctx.strokeStyle = cssVar("--rule"); ctx.lineWidth = 1;
    ctx.fillStyle = cssVar("--ink-faint"); ctx.font = "10px ui-monospace, SF Mono, Menlo, Consolas, monospace";
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    [yMin, (yMin + yMax) / 2, yMax].forEach((v) => {
      const y = toY(v);
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.globalAlpha = 0.5; ctx.stroke(); ctx.globalAlpha = 1;
      ctx.fillText(fmtNum(v), pad.l - 6, y);
    });
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    [t0, Math.round((t0 + t1) / 2), t1].forEach((t) => ctx.fillText(String(t), toX(t), pad.t + plotH + 6));

    // y-axis title, rotated. The first character of the string ends up at the BOTTOM of
    // the axis and the last at the top, and toY puts larger values higher — so the sign
    // cue has to run "−" first, "+" last.
    //
    // This previously read "+ Amount of reduction in expertise in system vs. starting
    // state -", which was wrong twice over. It named a comparison the report never
    // makes — every shortfall here is the no-AI arm minus the AI arm at the SAME tick,
    // a paired counterfactual, and nothing is measured against t=0 — and it put "+" at
    // the bottom, inverting the very cue it existed to give. It also said "expertise"
    // for whichever metric was selected, which now includes capability and leverage.
    ctx.font = "10px ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.save();
    ctx.translate(14, pad.t + plotH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(trajAxisTitle(metricKey), 0, 0);
    ctx.restore();

    // zero-reference line for shortfall metrics — deliberately loud (solid, thicker,
    // reserved red) since it marks the line between "AI hurt" and "AI helped", not just
    // another gridline
    if (yMin < 0 && yMax > 0) {
      ctx.strokeStyle = cssVar("--ref-line");
      ctx.lineWidth = 1.75;
      ctx.beginPath(); ctx.moveTo(pad.l, toY(0)); ctx.lineTo(w - pad.r, toY(0)); ctx.stroke();
      ctx.fillStyle = cssVar("--ref-line");
      ctx.font = "bold 10px ui-monospace, SF Mono, Menlo, Consolas, monospace";
      ctx.textAlign = "left"; ctx.textBaseline = "bottom";
      ctx.fillText("0", w - pad.r - 12, toY(0) - 3);
    }

    // Vertical reference lines for a one-off event in the experiment's timeline (e.g. the
    // recruitment set's freeze window). DATA.markTicks is empty for every set without one,
    // so this is a no-op everywhere else. Drawn BEFORE the series so the data lines sit on
    // top of it rather than the mark obscuring a trajectory that happens to pass near it.
    //
    // Resolved and laid out in two passes rather than one: two marks can land only a few
    // percent of the plot width apart (the recruitment set's start/end of a short freeze
    // inside a 300-year horizon is the case that motivated this), and drawing each
    // label independently produced overlapping, unreadable text at exactly those
    // separations. Lines are cheap to draw regardless of how close together they are;
    // labels are not, so only the labels need collision handling.
    const resolvedMarks = (DATA.markTicks || []).map((m) => {
      let tick = m.tick;
      if (tick == null && m.param) {
        // Resolved from a parameter's value in THIS panel: from the value the panel is
        // fixed at, if that parameter is the fixed axis; from exp.fixed, if it is pinned
        // (not swept by this experiment at all). If it is instead the axis varying across
        // this panel's lines, one tick cannot represent every line, so the mark is skipped
        // for that panel rather than drawn once at an arbitrary line's value.
        let value = null;
        if (axisKey(exp, fixAxis) === m.param) value = fixedValue;
        else if (Object.prototype.hasOwnProperty.call(exp.fixed, m.param)) value = exp.fixed[m.param];
        else return null; // m.param is the varying axis here — ambiguous, so no mark
        tick = m.base + m.scale * value;
      }
      if (tick == null || tick < t0 || tick > t1) return null; // unresolved or out of this panel's horizon
      return { label: m.label, x: toX(tick) };
    }).filter(Boolean).sort((a, b) => a.x - b.x);

    ctx.save();
    ctx.strokeStyle = cssVar("--ink-faint");
    ctx.lineWidth = 1.25;
    ctx.setLineDash([4, 3]);
    resolvedMarks.forEach((mk) => {
      ctx.beginPath(); ctx.moveTo(mk.x, pad.t); ctx.lineTo(mk.x, pad.t + plotH); ctx.stroke();
    });
    ctx.setLineDash([]);

    ctx.fillStyle = cssVar("--ink-faint");
    ctx.font = "9px ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif";
    ctx.textBaseline = "top";
    const placed = []; // {x0, x1, row} of labels already drawn, for collision checks
    const ROW_H = 10, LABEL_GAP = 4;
    resolvedMarks.forEach((mk) => {
      if (!mk.label) return;
      // Flips to the left of its line near the right edge, so the label is not clipped by
      // the panel's own boundary on a mark placed late in the horizon.
      const flip = mk.x > pad.l + plotW * 0.7;
      const width = ctx.measureText(mk.label).width;
      const x0 = flip ? mk.x - LABEL_GAP - width : mk.x + LABEL_GAP;
      const x1 = x0 + width;
      // Drop to the next row down while this span overlaps an already-placed label in
      // that row. Capped at 3 rows: beyond that the panel is too short on marks for this
      // to matter, and continuing to stack would start colliding with the data itself.
      let row = 0;
      while (row < 3 && placed.some((p) => p.row === row && x0 < p.x1 + LABEL_GAP && p.x0 < x1 + LABEL_GAP)) row++;
      placed.push({ x0, x1, row });
      ctx.textAlign = flip ? "right" : "left";
      ctx.fillText(mk.label, flip ? mk.x - LABEL_GAP : mk.x + LABEL_GAP, pad.t + 2 + row * ROW_H);
    });
    ctx.restore();

    const n = varyingValues.length;
    varyingValues.forEach((vv, i) => {
      const pts = series.get(vv) || [];
      if (!pts.length) return;
      const isHover = hoverKey != null && Math.abs(vv - hoverKey) < 1e-9;
      ctx.strokeStyle = seqRamp(n > 1 ? i / (n - 1) : 0.5, isDark);
      ctx.lineWidth = isHover ? 3 : 1.4;
      ctx.globalAlpha = isHover || hoverKey == null ? 1 : 0.35;
      ctx.beginPath();
      pts.forEach((p, pi) => { const x = toX(p.t), y = toY(p.v); if (pi === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
      ctx.stroke();
    });
    ctx.globalAlpha = 1;

    // average across every varying-axis line, for this fixed value — drawn last (on
    // top), dashed, in the theme's ink color so it never gets mistaken for one of the
    // sequential-colored data lines
    const avgPts = ticks.map((t, ti) => {
      let sum = 0, count = 0;
      varyingValues.forEach((vv) => {
        const pts = series.get(vv);
        const p = pts && pts[ti];
        if (p && p.v != null) { sum += p.v; count++; }
      });
      return { t, v: count ? sum / count : null };
    }).filter((p) => p.v != null);
    if (avgPts.length) {
      ctx.strokeStyle = cssVar("--ink");
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 5]);
      ctx.beginPath();
      avgPts.forEach((p, pi) => { const x = toX(p.t), y = toY(p.v); if (pi === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
      ctx.stroke();
      ctx.setLineDash([]);
    }

    canvas._hit = { pad, plotW, plotH, t0, t1, toX, varyingValues, series };
  }

  function hitTestTraj(canvas, evt) {
    const hit = canvas._hit;
    if (!hit) return null;
    const rect = canvas.getBoundingClientRect();
    const x = evt.clientX - rect.left;
    const t = hit.t0 + ((x - hit.pad.l) / hit.plotW) * (hit.t1 - hit.t0);
    if (x < hit.pad.l || x > hit.pad.l + hit.plotW) return null;
    // nearest line by y-distance at this t
    const y = evt.clientY - rect.top;
    let best = null, bestPoint = null, bestDist = Infinity;
    hit.varyingValues.forEach((vv) => {
      const pts = hit.series.get(vv) || [];
      if (!pts.length) return;
      let nearest = pts[0];
      pts.forEach((p) => { if (Math.abs(p.t - t) < Math.abs(nearest.t - t)) nearest = p; });
      if (nearest.v == null) return;
      const py = hit.pad.t + hit.plotH - ((nearest.v - hit._yMin) / (hit._yMax - hit._yMin)) * hit.plotH;
      const d = Math.abs(py - y);
      if (d < bestDist) { bestDist = d; best = vv; bestPoint = nearest; }
    });
    return { varyingValue: best, point: bestPoint };
  }

  const trajTooltips = {};
  function ensureTrajTooltip(panelKey) {
    if (trajTooltips[panelKey]) return trajTooltips[panelKey];
    const el = document.createElement("div");
    el.className = "chart-tooltip";
    el.hidden = true;
    document.getElementById("trajWrap" + panelKey).appendChild(el);
    trajTooltips[panelKey] = el;
    return el;
  }

  function wireTrajHover(canvasId, panelKey) {
    const canvas = document.getElementById(canvasId);
    canvas.addEventListener("mousemove", (evt) => {
      const hit = canvas._hit;
      if (hit) { hit._yMin = trajCurrentDomain[0]; hit._yMax = trajCurrentDomain[1]; }
      const res = hitTestTraj(canvas, evt);
      trajHover[panelKey] = res ? res.varyingValue : null;
      renderTrajectories(true);

      const tt = ensureTrajTooltip(panelKey);
      if (!res || !res.point) { tt.hidden = true; return; }
      const exp = currentExperiment();
      const varyKey = axisKey(exp, otherAxis(app.trajFixAxis));
      const metricLabel = DATA.metrics.find((m) => m.key === app.metricKey).label;
      tt.innerHTML =
        '<div class="row"><b>' + sym(varyKey) + " " + pretty(varyKey) + '</b><span>' + fmtAxis(varyKey, res.varyingValue) + "</span></div>" +
        '<div class="row"><span>t</span><span>' + res.point.t + "</span></div>" +
        '<div class="row"><span>' + metricLabel + '</span><span>' + fmtNum(res.point.v) + "</span></div>";
      tt.hidden = false;
      positionTooltip(tt, document.getElementById("trajWrap" + panelKey).getBoundingClientRect(), evt);
    });
    canvas.addEventListener("mouseleave", () => {
      trajHover[panelKey] = null;
      const tt = trajTooltips[panelKey];
      if (tt) tt.hidden = true;
      renderTrajectories(true);
    });
  }

  let trajCurrentDomain = [0, 1];
  function renderTrajectories(fromHover) {
    const exp = currentExperiment();
    if (app.trajValueA == null || app.trajValueB == null || !axisValues(exp, app.trajFixAxis).length) ensureTrajDefaults();

    const domain = fromHover ? trajCurrentDomain : trajDomain(exp, app.trajFixAxis, app.trajValueA, app.trajValueB, app.metricKey);
    trajCurrentDomain = domain;
    drawTrajPanel("trajCanvasA", exp, app.trajFixAxis, app.trajValueA, app.metricKey, domain, trajHover.A);
    drawTrajPanel("trajCanvasB", exp, app.trajFixAxis, app.trajValueB, app.metricKey, domain, trajHover.B);

    if (fromHover) return; // labels/controls/legend are unchanged by a hover-only redraw

    buildTrajControls();

    const fixKey = axisKey(exp, app.trajFixAxis);
    const varyKey = axisKey(exp, otherAxis(app.trajFixAxis));
    const metricLabel = DATA.metrics.find((m) => m.key === app.metricKey).label;

    document.getElementById("trajTitle").innerHTML =
      metricLabel + " over time, sliced by <span class=\"mono\" style=\"color:var(--accent2)\">" + sym(fixKey) + "</span> " + pretty(fixKey);
    document.getElementById("trajHeadA").innerHTML = sym(fixKey) + " " + pretty(fixKey) + " held at <b>" + fmtAxis(fixKey, app.trajValueA) + "</b>";
    document.getElementById("trajHeadB").innerHTML = sym(fixKey) + " " + pretty(fixKey) + " held at <b>" + fmtAxis(fixKey, app.trajValueB) + "</b>";

    const varyValues = axisValues(exp, otherAxis(app.trajFixAxis));
    const isDark = currentTheme() === "dark";
    const stops = [];
    const N = 20;
    for (let i = 0; i <= N; i++) stops.push(seqRamp(i / N, isDark) + " " + ((i / N) * 100) + "%");
    document.getElementById("trajLegendRamp").style.background = "linear-gradient(90deg," + stops.join(",") + ")";
    document.getElementById("trajLegendMin").textContent = fmtAxis(varyKey, varyValues[0]);
    document.getElementById("trajLegendMax").textContent = fmtAxis(varyKey, varyValues[varyValues.length - 1]);
    document.getElementById("trajLegendLabel").textContent = "line color = " + sym(varyKey) + " " + pretty(varyKey);
  }
  wireTrajHover("trajCanvasA", "A");
  wireTrajHover("trajCanvasB", "B");

  /* ---------- top-level render ---------- */
  function render() {
    const exp = currentExperiment();
    document.getElementById("tickLabel").textContent = exp.ticks[app.tickIndex];

    const heatmapOn = app.viewMode !== "trajectories";
    document.getElementById("heatmapPanel").style.display = heatmapOn ? "block" : "none";
    document.getElementById("trajectoryPanel").style.display = heatmapOn ? "none" : "block";

    if (heatmapOn) {
      document.getElementById("heatmapTitle").innerHTML =
        '<span class="mono" style="color:var(--accent2)">' + sym(axisKey(exp, "x")) + "</span> " + pretty(axisKey(exp, "x")) +
        ' <span style="color:var(--ink-faint)">×</span> ' +
        '<span class="mono" style="color:var(--accent2)">' + sym(axisKey(exp, "y")) + "</span> " + pretty(axisKey(exp, "y"));
      // A plain-English sentence, not the run count. "N runs, M replicates/cell" told
      // the reader nothing about what the colours MEAN — this is the same explanation
      // the ? tooltip gives, just always visible rather than needing a hover to find.
      {
        const m = DATA.metrics.find((x) => x.key === app.metricKey);
        document.getElementById("heatmapSub").textContent = (m && m.help) || m.label;
      }
      const isTable = app.viewMode === "table";
      document.getElementById("heatmapCanvas").style.display = isTable ? "none" : "block";
      document.getElementById("tableWrap").style.display = isTable ? "block" : "none";
      // The LaTeX copy is a tabular of the grid, so it is offered only where a grid is
      // actually on screen.
      document.getElementById("tableToolbar").style.display = isTable ? "flex" : "none";
      // The image buttons export the heatmap CANVAS, which the table view replaces with
      // an HTML table — there is nothing to rasterise there, and #tableToolbar offers the
      // export that does make sense in that view.
      document.getElementById("heatmapImgToolbar").style.display = isTable ? "none" : "flex";
      renderStatsStrip();
      if (isTable) renderTable(); else drawHeatmap();
      renderLegend();
    } else {
      renderTrajectories();
    }
  }

  function onExperimentChange() {
    buildExpList();
    buildFixedPanel();
    buildFigureCaptions();
    buildTickRange();
    // trajValueA/B belong to the previous experiment's axis values and won't generally
    // exist in the new one's — force ensureTrajDefaults() to re-derive them instead of
    // silently rendering a stale, off-list value.
    app.trajValueA = null;
    app.trajValueB = null;
    render();
  }

  document.getElementById("metaLine").textContent = "generated " + DATA.generatedAt + " · horizon t=" + DATA.horizon;
  buildMetricSelect();
  renderSetNote();
  // Bound once at boot, not inside render(): render() runs on every tick drag and would
  // otherwise stack a fresh listener per frame.
  document.getElementById("copyLatexBtn").addEventListener("click", copyTableAsLatex);
  onExperimentChange();
  window.addEventListener("resize", render);
  new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
</script>
