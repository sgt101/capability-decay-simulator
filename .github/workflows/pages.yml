# Publishes the interactive simulator to GitHub Pages.
#
# Only the simulator and the three report browsers go up, not the whole repository: see
# src/build_pages.js for what it assembles and why.
#
# The reports are COMMITTED build artifacts. They are generated from results/ — 2.1 GB of
# CSV that is not in the repository — so this workflow cannot rebuild them; it publishes
# whatever was last committed. Rebuild and commit them with ./src/build_reports.sh when
# the experiments change, or the site keeps serving the previous run.
name: Deploy simulator to Pages

on:
  push:
    branches: [main]
    # Rebuild only when something the published page actually contains changes.
    paths:
      - src/simulator.html
      - src/engine.js
      - src/world_model.js
      - data/world-model-data.js
      - src/build_pages.js
      - .github/workflows/pages.yml
      # The generated report browsers. Committed rather than built here: they come from
      # results/, 2.1 GB of CSV that is not in the repository, so CI cannot rebuild them
      # and a push of the built file is the only thing that can update them on the site.
      - doc/report.html
      - doc/structure_report.html
      - doc/results_ACL.html
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Not cancel-in-progress: a half-finished deploy that gets
# cancelled leaves the live site on whichever version happened to land.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v5 on both, not v4: the runner deprecation notice is about the runtime each
      # ACTION itself declares (`using: node20` in its action.yml), which is a separate
      # thing from node-version below — that one only picks the Node our own scripts get,
      # and was already 24 while the warning still fired. v5 is the first major of each
      # that declares node24.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # The bundled world-model data is GENERATED from world-model.json and
      # mobility-costs.json. If it has drifted from them, the published simulator runs a
      # different graph from the one the repository describes — silently, because the
      # page loads whatever bundle it is given. This test compares the two.
      - name: Bundled world-model data matches its sources
        run: node src/test/test_world_model.js

      - name: Build site/
        run: node src/build_pages.js

      # Boot the ASSEMBLED page, not the source one. This is what catches a dependency
      # that failed to copy or a path that no longer resolves — the page degrades to the
      # generated graph rather than erroring, so nothing else would notice.
      #
      # site/simulator.html, not site/index.html: index.html is the landing page now.
      - name: Built page boots and loads the world model
        run: |
          node src/test/dom_stub_test.js site/simulator.html | tee /tmp/boot.log
          grep -q "booted with the bundle" /tmp/boot.log

      # The landing page links to the simulator and to whichever reports were present at
      # build time. Cheap to check and easy to break: the reports are optional, so the
      # list is generated rather than written down, and a bad href here is a 404 on the
      # site's front door.
      - name: Landing page links resolve
        run: node src/test/test_landing_links.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
